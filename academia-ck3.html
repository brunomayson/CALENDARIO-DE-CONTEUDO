      function iniciarDiagnostico() {
        state.tela = "diagnostico";
        state.diagnostico = { i: 0, acertos: 0 };
        render();
      }

      function responderDiagnostico(idx) {
        const pergunta = QUIZ.diagnostico[state.diagnostico.i];
        if (!pergunta) return;
        if (idx === pergunta.c) {
          state.diagnostico.acertos += 1;
        }
        state.diagnostico.i += 1;
        if (state.diagnostico.i >= QUIZ.diagnostico.length) {
          const pct = state.diagnostico.acertos / QUIZ.diagnostico.length;
          state.nivel = pct >= 0.8 ? "avançado" : pct >= 0.6 ? "intermediário" : "iniciante";
          state.tela = "resultado-diagnostico";
        }
        render();
      }

      function abrirModulo(id) {
        state.moduloAtivo = id;
        state.tela = "licao";
        state.passo = 0;
        state.quiz = { i: 0, acertos: 0, respondeu: false, feedback: null, selecionada: null };
        if (state.nivel === "avançado") state.dificuldade = "difícil";
        else if (state.nivel === "intermediário") state.dificuldade = "média";
        else state.dificuldade = "fácil";
        render();
      }

      function irParaPratica() {
        state.tela = "pratica";
        render();
      }

      function responderQuiz(idx) {
        if (state.quiz.respondeu) return;
        const banco = QUIZ[state.moduloAtivo] || [];
        const pergunta = banco[state.quiz.i];
        if (!pergunta) return;
        const correto = idx === pergunta.c;
        if (correto) state.quiz.acertos += 1;
        state.quiz.respondeu = true;
        state.quiz.selecionada = idx;
        state.quiz.feedback = {
          correto,
          texto: pergunta.exp,
        };
        atualizarDificuldade();
        render();
      }

        const respondidas = state.quiz.i + 1;
        if (respondidas % 3 !== 0) return;
        const taxa = state.quiz.acertos / respondidas;
        if (taxa >= 0.8 && state.dificuldade !== "difícil") {
          state.dificuldade = state.dificuldade === "fácil" ? "média" : "difícil";
        }
        if (taxa < 0.5 && state.dificuldade !== "fácil") {
          state.dificuldade = state.dificuldade === "difícil" ? "média" : "fácil";
        }
      }

      function proximaQuestao() {
        const banco = QUIZ[state.moduloAtivo] || [];
        if (!banco.length || state.quiz.i >= banco.length - 1) {
          concluirModulo();
          return;
        }
        state.quiz.i += 1;
        state.quiz.respondeu = false;
        state.quiz.feedback = null;
        state.quiz.selecionada = null;
        render();
      }

      function concluirModulo() {
        const banco = QUIZ[state.moduloAtivo] || [];
        const respondidas = Math.max(1, state.quiz.i + (state.quiz.respondeu ? 1 : 0));
        const desempenho = state.quiz.acertos / respondidas;
        const estrelas = Math.max(1, Math.round(desempenho * 5));
        state.progresso[state.moduloAtivo] = { feito: true, estrelas };
        if (desempenho < 0.8 && !state.revisao.includes(state.moduloAtivo)) {
          state.revisao.push(state.moduloAtivo);
        }
        if (desempenho >= 0.8) {
          state.revisao = state.revisao.filter((m) => m !== state.moduloAtivo);
        }
        state.tela = "modulo-concluido";
        render();
      }

      function voltarGrade() {
        state.tela = "grade";
        render();
      }

      function voltarLicoes() {
        state.tela = "licao";
        render();
      }

      function avancarPasso() {
        const total = LESSONS[state.moduloAtivo].passos.length;
        if (state.passo < total - 1) {
          state.passo += 1;
          render();
        }
      }

      function voltarPasso() {
        if (state.passo > 0) {
          state.passo -= 1;
          render();
        }
      }

      function renderHeader() {
        return `
          <header class="sticky top-0 z-10 fancy-gradient text-white px-6 py-4 shadow-xl shadow-indigo-500/20">
            <div class="max-w-6xl mx-auto flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
              <div class="flex items-center gap-3 text-lg font-semibold tracking-wide">
                <span class="emoji-icon bg-white/20 rounded-xl p-2">🏰</span>
                <span>Academia de Reis — Instrutor Mestre CK3</span>
              </div>
              <div class="flex flex-wrap gap-4 text-sm">
                <div class="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-full">
                  <span class="emoji-icon">⭐</span>
                  <span>Nível: ${state.nivel ? state.nivel : "—"}</span>
                </div>
                <div class="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-full">
                  <span class="emoji-icon">🎯</span>
                  <span>Dificuldade: ${state.dificuldade}</span>
                </div>
              </div>
            </div>
          </header>
        `;
      }

      function renderBoasVindas() {
        return `
          <div class="min-h-screen fancy-gradient text-white">
            ${renderHeader()}
            <main class="max-w-4xl mx-auto px-6 py-16 text-center">
              <div class="mb-10 animate-bounce text-6xl">✨</div>
              <h1 class="text-4xl md:text-5xl font-extrabold mb-4">
                Bem-vindo à Academia de Reis
              </h1>
              <p class="text-lg md:text-xl opacity-90">
                Do primeiro clique ao domínio total de Crusader Kings 3. Método avançado,
                prático e 100% em português.
              </p>
              <div class="mt-10 flex flex-col sm:flex-row justify-center items-center gap-4">
                <button data-action="iniciar-diagnostico" class="px-6 py-3 rounded-2xl bg-yellow-400 text-indigo-900 font-bold shadow-lg shadow-yellow-500/40 hover:scale-105 transition">
                  Iniciar Diagnóstico
                </button>
                <button data-action="ver-modulos" class="px-6 py-3 rounded-2xl border border-white/40 bg-white/10 hover:bg-white/20 transition">
                  Ver Módulos
                </button>
              </div>
              <div class="mt-12 glass-card rounded-3xl px-6 py-8 text-left text-white/90">
                <div class="flex items-center gap-3 text-lg font-semibold mb-4">
                  <span class="emoji-icon">❓</span>
                  <span>Como funciona</span>
                </div>
                <ul class="list-disc ml-6 text-sm space-y-2">
                  <li>Explique + mostre + peça ação (clique a clique).</li>
                  <li>Filtros e botões com os nomes oficiais do jogo em PT-BR.</li>
                  <li>Active recall ao final de cada módulo.</li>
                  <li>Simulações de erros comuns com correções guiadas.</li>
                  <li>Gating: novos módulos liberam após dominar os anteriores.</li>
                </ul>
              </div>
            </main>
          </div>
        `;
      }

      function renderDiagnostic() {
        const pergunta = QUIZ.diagnostico[state.diagnostico.i];
        return `
          <div class="min-h-screen bg-slate-50">
            ${renderHeader()}
            <main class="max-w-3xl mx-auto px-6 py-12">
              <div class="glass-card rounded-3xl p-8 shadow-xl space-y-6">
                <div class="flex flex-col gap-1">
                  <span class="text-sm font-semibold text-indigo-500 uppercase tracking-wide">Teste de Diagnóstico</span>
                  <h2 class="text-2xl font-bold text-slate-900">Questão ${state.diagnostico.i + 1} de ${QUIZ.diagnostico.length}</h2>
                </div>
                <p class="text-lg font-semibold text-slate-900">${pergunta.q}</p>
                <div class="grid gap-3 md:grid-cols-2">
                  ${pergunta.a
                    .map(
                      (alt, idx) => `
                        <button data-action="responder-diagnostico" data-index="${idx}" class="text-left px-4 py-3 rounded-2xl border border-slate-200 hover:bg-slate-100 transition">
                          ${alt}
                        </button>
                      `
                    )
                    .join("")}
                </div>
              </div>
            </main>
          </div>
        `;
      }

      function renderResultadoDiagnostico() {
        const pct = Math.round(
          (state.diagnostico.acertos / QUIZ.diagnostico.length) * 100
        );
        return `
          <div class="min-h-screen bg-slate-50">
            ${renderHeader()}
            <main class="max-w-3xl mx-auto px-6 py-12">
              <div class="glass-card rounded-3xl p-10 text-center space-y-6">
                <div class="text-6xl">🏆</div>
                <div class="text-5xl font-extrabold text-slate-900">${pct}%</div>
                <p class="text-lg text-slate-700">Nível inicial: <strong>${state.nivel}</strong></p>
                <div class="flex flex-wrap justify-center gap-3">
                  <button data-action="ver-modulos" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition">Explorar módulos</button>
                  <button data-action="abrir-preparacao" class="px-5 py-2.5 rounded-xl border border-slate-200 font-semibold hover:bg-slate-100 transition">Começar pela Preparação</button>
                </div>
              </div>
            </main>
          </div>
        `;
      }

      function renderGrade() {
        const cards = MODULOS.map((modulo, idx) => {
          const progresso = state.progresso[modulo.id];
          const bloqueado =
            idx > 0 && !state.progresso[MODULOS[idx - 1].id]?.feito;
          const estrelas = progresso ? progresso.estrelas : 0;
          const percent = Math.min(100, estrelas * 20);
          return `
            <div class="glass-card rounded-3xl p-6 space-y-4 ${
              bloqueado ? "opacity-60" : ""
            }">
              <div class="flex items-center gap-3">
                <div class="p-2 rounded-2xl bg-gradient-to-br ${
                  modulo.cor
                } text-white text-xl">${LESSONS[modulo.id].emoji}</div>
                <div class="flex-1">
                  <h3 class="text-lg font-bold text-slate-900">${modulo.nome}</h3>
                  <p class="text-xs text-slate-500">${LESSONS[modulo.id].titulo}</p>
                </div>
                <span class="text-xl">${progresso?.feito ? "✅" : "🔒"}</span>
              </div>
              <div class="w-full h-2 rounded-full bg-slate-200 overflow-hidden">
                <div class="h-full bg-indigo-500" style="width: ${percent}%;"></div>
              </div>
              <div class="flex items-center justify-between text-sm">
                <div class="flex items-center gap-2">
                  <span>⭐</span>
                  <span>${estrelas} / 5</span>
                </div>
                <button data-action="abrir-modulo" data-modulo="${modulo.id}" ${
                  bloqueado ? "disabled" : ""
                } class="px-3 py-1.5 rounded-xl text-white font-semibold ${
            bloqueado
              ? "bg-slate-300 cursor-not-allowed"
              : "bg-indigo-600 hover:bg-indigo-700"
          }">${progresso?.feito ? "Revisar" : "Começar"}</button>
              </div>
            </div>
          `;
        }).join("");

        const revisoes = state.revisao.length
          ? state.revisao
              .map(
                (id) => `
                  <button data-action="abrir-modulo" data-modulo="${id}" class="text-left p-4 rounded-2xl border border-slate-200 hover:bg-slate-100 transition">
                    <div class="font-semibold text-slate-900">${LESSONS[id].titulo}</div>
                    <div class="text-xs text-slate-500">Clique para reforçar os pontos fracos</div>
                  </button>
                `
              )
              .join("")
          : `<p class="text-slate-600">Você não possui revisões pendentes. Bom trabalho!</p>`;

        const checkpoints = CHECKPOINTS.map(
          (ck) => `
            <div class="p-4 rounded-2xl border border-slate-200">
              <div class="text-xs font-semibold text-indigo-500 uppercase tracking-wide">${ck.tempo}</div>
              <ul class="list-disc ml-5 text-sm text-slate-700 mt-2 space-y-1">
                ${ck.metas.map((meta) => `<li>${meta}</li>`).join("")}
              </ul>
            </div>
          `
        ).join("");

        return `
          <div class="min-h-screen bg-slate-50">
            ${renderHeader()}
            <main class="max-w-6xl mx-auto px-6 py-12 space-y-8">
              <section class="grid gap-6 md:grid-cols-3">
                ${cards}
              </section>
              <section class="glass-card rounded-3xl p-6">
                <div class="flex items-center gap-3 mb-4">
                  <span class="emoji-icon">🛡️</span>
                  <div>
                    <h3 class="text-lg font-bold text-slate-900">Revisão adaptativa</h3>
                    <p class="text-sm text-slate-600">Módulos que ficaram abaixo de 80% aparecem aqui.</p>
                  </div>
                </div>
                <div class="grid gap-3 md:grid-cols-2">${revisoes}</div>
              </section>
              <section class="glass-card rounded-3xl p-6">
                <div class="flex items-center gap-3 mb-4">
                  <span class="emoji-icon">🗂️</span>
                  <div>
                    <h3 class="text-lg font-bold text-slate-900">Checkpoints de mestre</h3>
                    <p class="text-sm text-slate-600">Metas para revisar seu progresso dinástico.</p>
                  </div>
                </div>
                <div class="grid gap-4 md:grid-cols-3">${checkpoints}</div>
              </section>
            </main>
          </div>
        `;
      }

      function renderLicao() {
        const modulo = state.moduloAtivo ? LESSONS[state.moduloAtivo] : null;
        if (!modulo) return "";
        const passoAtual = modulo.passos[state.passo];
        const podeAvancar = state.passo < modulo.passos.length - 1;
        const podeVoltar = state.passo > 0;
        const checklist = modulo.checklist
          .map((item) => `<span class="inline-flex items-center gap-2 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1 text-xs font-semibold">${item}</span>`)
          .join(" ");
        return `
          <div class="min-h-screen bg-slate-50">
            ${renderHeader()}
            <main class="max-w-5xl mx-auto px-6 py-10 space-y-6">
              <div class="flex items-center gap-3">
                <button data-action="ver-modulos" class="px-3 py-1.5 rounded-xl border border-slate-200 hover:bg-white transition">⬅️</button>
                <div class="p-2 rounded-2xl bg-gradient-to-br ${
                  MODULOS.find((m) => m.id === state.moduloAtivo).cor
                } text-white text-xl">${modulo.emoji}</div>
                <h2 class="text-2xl font-bold text-slate-900 flex-1">${modulo.titulo}</h2>
                <span class="inline-flex items-center gap-2 rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold">Dificuldade: ${state.dificuldade}</span>
              </div>
              <div class="glass-card rounded-3xl p-6 space-y-5">
                <div>
                  <div class="text-sm font-semibold text-indigo-500 uppercase tracking-wide mb-1">Passo ${state.passo + 1} de ${
          modulo.passos.length
        }</div>
                  <h3 class="text-xl font-bold text-slate-900">${passoAtual.titulo}</h3>
                  <ul class="list-disc ml-6 mt-3 space-y-2 text-slate-700">
                    ${passoAtual.acao.map((item) => `<li>${item}</li>`).join("")}
                  </ul>
                </div>
                ${
                  passoAtual.dica
                    ? `<div class="bg-indigo-50 border border-indigo-200 text-indigo-800 px-4 py-3 rounded-2xl text-sm">💡 ${passoAtual.dica}</div>`
                    : ""
                }
                <div class="flex flex-wrap gap-3 justify-between">
                  <button data-action="passo-anterior" class="px-4 py-2 rounded-xl border border-slate-200 ${
                    podeVoltar ? "hover:bg-slate-100" : "opacity-50 cursor-not-allowed"
                  }" ${podeVoltar ? "" : "disabled"}>⬅️ Anterior</button>
                  ${podeAvancar
                    ? `<button data-action="passo-proximo" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition">Próximo ➡️</button>`
                    : `<button data-action="ir-pratica" class="px-4 py-2 rounded-xl bg-emerald-600 text-white font-semibold hover:bg-emerald-700 transition">Pronto! Vamos praticar ⚔️</button>`}
                </div>
              </div>
              <div class="glass-card rounded-3xl p-6">
                <div class="flex items-center gap-3 mb-3">
                  <span class="emoji-icon">✅</span>
                  <h3 class="text-lg font-semibold text-slate-900">Checklist do módulo</h3>
                </div>
                <div class="flex flex-wrap gap-2">${checklist}</div>
              </div>
              ${renderSimulacoes()}
            </main>
          </div>
        `;
      }

      function renderSimulacoes() {
        const simulacoes = Object.values(ERROR_SIMULATIONS)
          .map(
            (sim) => `
              <div class="p-4 rounded-2xl border border-slate-200">
                <div class="font-semibold text-slate-900 mb-2">${sim.titulo}</div>
                <ol class="list-decimal ml-5 text-sm text-slate-700 space-y-1">
                  ${sim.passos.map((p) => `<li>${p}</li>`).join("")}
                </ol>
              </div>
            `
          )
          .join("");
        return `
          <div class="glass-card rounded-3xl p-6">
            <div class="flex items-center gap-3 mb-4">
              <span class="emoji-icon">⚠️</span>
              <div>
                <h3 class="text-lg font-semibold text-slate-900">Simulações de erro</h3>
                <p class="text-sm text-slate-600">Pratique o erro de forma segura e corrija em seguida.</p>
              </div>
            </div>
            <div class="grid gap-3 md:grid-cols-3">${simulacoes}</div>
          </div>
        `;
      }

      function renderPratica() {
        const banco = QUIZ[state.moduloAtivo] || [];
        const pergunta = banco[state.quiz.i];
        if (!pergunta) {
          return `
            <div class="min-h-screen bg-slate-50">
              ${renderHeader()}
              <main class="max-w-3xl mx-auto px-6 py-12">
                <div class="glass-card rounded-3xl p-8 text-center space-y-4">
                  <div class="text-5xl">🏆</div>
                  <p class="text-lg">Você concluiu as questões deste módulo.</p>
                  <button data-action="finalizar-modulo" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition">Finalizar módulo</button>
                </div>
              </main>
            </div>
          `;
        }
        const total = banco.length;
        return `
          <div class="min-h-screen bg-slate-50">
            ${renderHeader()}
            <main class="max-w-4xl mx-auto px-6 py-10 space-y-6">
              <div class="flex items-center gap-3">
                <button data-action="voltar-licao" class="px-3 py-1.5 rounded-xl border border-slate-200 hover:bg-white transition">⬅️</button>
                <div class="p-2 rounded-2xl bg-indigo-500 text-white text-xl">🎯</div>
                <h2 class="text-2xl font-bold text-slate-900 flex-1">Prática guiada</h2>
                <span class="inline-flex items-center gap-2 rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold">Dificuldade: ${state.dificuldade}</span>
              </div>
              <div class="glass-card rounded-3xl p-6 space-y-6">
                <h3 class="text-lg font-semibold text-slate-900">${pergunta.q}</h3>
                <div class="grid gap-3 md:grid-cols-2">
                  ${pergunta.a
                    .map((alt, idx) => {
                      const selecionada = state.quiz.selecionada === idx;
                      const estado = state.quiz.respondeu
                        ? idx === pergunta.c
                          ? "border-emerald-400 bg-emerald-50"
                          : selecionada
                          ? "border-rose-300 bg-rose-50"
                          : "opacity-70"
                        : "hover:bg-slate-100";
                      return `<button data-action="responder-quiz" data-index="${idx}" class="text-left px-4 py-3 rounded-2xl border border-slate-200 transition ${estado}" ${
                        state.quiz.respondeu ? "disabled" : ""
                      }>${alt}</button>`;
                    })
                    .join("")}
                </div>
                ${state.quiz.feedback
                  ? `<div class="rounded-2xl px-4 py-3 text-sm ${
                      state.quiz.feedback.correto
                        ? "bg-emerald-50 border border-emerald-200 text-emerald-800"
                        : "bg-amber-50 border border-amber-200 text-amber-800"
                    }">
                      <div class="font-semibold mb-1">${
                        state.quiz.feedback.correto ? "Perfeito!" : "Quase lá!"
                      }</div>
                      <p>${state.quiz.feedback.texto}</p>
                      <button data-action="proxima-questao" class="mt-3 px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition">Próximo</button>
                    </div>`
                  : ""}
              </div>
              <div class="glass-card rounded-3xl p-4 flex flex-wrap gap-3 text-sm text-slate-600">
                <span class="inline-flex items-center gap-2 rounded-full bg-slate-100 px-3 py-1">Questão ${
                  state.quiz.i + 1
                } / ${total}</span>
                <span class="inline-flex items-center gap-2 rounded-full bg-slate-100 px-3 py-1">Acertos: ${
                  state.quiz.acertos
                }</span>
              </div>
              ${renderSimulacoes()}
            </main>
          </div>
        `;
      }

      function renderModuloConcluido() {
        const progresso = state.progresso[state.moduloAtivo] || { estrelas: 0 };
        const estrelas = progresso.estrelas;
        const estrelasHtml = Array.from({ length: 5 })
          .map(
            (_, idx) =>
              `<span class="text-3xl ${idx < estrelas ? "text-yellow-400" : "text-slate-300"}">⭐</span>`
          )
          .join("");
        return `
          <div class="min-h-screen bg-slate-50">
            ${renderHeader()}
            <main class="max-w-3xl mx-auto px-6 py-12">
              <div class="glass-card rounded-3xl p-10 text-center space-y-6">
                <div class="text-6xl">🏆</div>
                <h3 class="text-2xl font-bold text-slate-900">Módulo concluído!</h3>
                <div class="flex items-center justify-center gap-2">${estrelasHtml}</div>
                <div class="flex flex-wrap justify-center gap-3">
                  <button data-action="ver-modulos" class="px-5 py-2.5 rounded-xl border border-slate-200 font-semibold hover:bg-slate-100 transition">Voltar aos módulos</button>
                  <button data-action="refazer-modulo" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition">Refazer para 5★</button>
                </div>
              </div>
            </main>
          </div>
        `;
      }

      function render() {
        let html = "";
        switch (state.tela) {
          case "boasvindas":
            html = renderBoasVindas();
            break;
          case "diagnostico":
            html = renderDiagnostic();
            break;
          case "resultado-diagnostico":
            html = renderResultadoDiagnostico();
            break;
          case "grade":
            html = renderGrade();
            break;
          case "licao":
            html = renderLicao();
            break;
          case "pratica":
            html = renderPratica();
            break;
          case "modulo-concluido":
            html = renderModuloConcluido();
            break;
          default:
            html = renderBoasVindas();
        }
        app.innerHTML = html;
        bindEvents();
      }

      function bindEvents() {
        document.querySelectorAll("[data-action]").forEach((el) => {
          el.addEventListener("click", (event) => {
            const action = event.currentTarget.dataset.action;
            const index = parseInt(event.currentTarget.dataset.index, 10);
            const modulo = event.currentTarget.dataset.modulo;
            switch (action) {
              case "iniciar-diagnostico":
                iniciarDiagnostico();
                break;
              case "ver-modulos":
                voltarGrade();
                break;
              case "responder-diagnostico":
                responderDiagnostico(index);
                break;
              case "abrir-preparacao":
                abrirModulo("preparacao");
                break;
              case "abrir-modulo":
                if (!event.currentTarget.disabled) abrirModulo(modulo);
                break;
              case "passo-proximo":
                avancarPasso();
                break;
              case "passo-anterior":
                voltarPasso();
                break;
              case "ir-pratica":
                irParaPratica();
                break;
              case "responder-quiz":
                responderQuiz(index);
                break;
              case "proxima-questao":
                proximaQuestao();
                break;
              case "finalizar-modulo":
                concluirModulo();
                break;
              case "voltar-licao":
                voltarLicoes();
                break;
              case "refazer-modulo":
                abrirModulo(state.moduloAtivo);
                break;
              default:
                break;
            }
          });
        });
      }

      render();
    </script>
  </body>
</html>
