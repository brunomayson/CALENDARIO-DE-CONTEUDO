        },
        guerra_sem_ouro: {
          titulo: \"Erro Simulado: Declarar Guerra sem Reserva de Ouro\",
          passos: [
            \"Entre em guerra com < 100 de ouro\",
            \"Veja eventos de dívida, moral baixa de mercenários, risco de facções\",
            \"Recomece com ≥ 200 de ouro e contrate mercenários baratos antes da declaração\",
          ],
        },
      };

      const CHECKPOINTS = [
        {
          tempo: \"Ano 10\",
          metas: [
            \"2 alianças\",
            \"1 casamento genético em andamento\",
            \"Contrato melhorado com 1 vassalo\",
          ],
        },
        {
          tempo: \"Ano 25\",
          metas: [
            \"500 de ouro de reserva\",
            \"Facções sob 80% de força\",
            \"Capital com desenvolvimento em alta\",
          ],
        },
        {
          tempo: \"Ano 50\",
          metas: [
            \"2 legados dinásticos\",
            \"Herdeiro com traço herdável de nível 2+\",
            \"Exército profissional consolidado\",
          ],
        },
      ];


      const ProgressBar = ({ value, max = 100 }) => (
        <div className=\"w-full h-2.5 bg-slate-200 rounded-full overflow-hidden\">
          <div
            className=\"h-full bg-gradient-to-r from-indigo-500 via-purple-500 to-rose-500 transition-all duration-500\"
            style={{ width: `${Math.min(100, (value / max) * 100)}%` }}
          />
        </div>
      );

      function AcademiaCK3() {
        const [tela, setTela] = useState(\"boasvindas\");
        const [moduloAtivo, setModuloAtivo] = useState(null);
        const [passo, setPasso] = useState(0);
        const [progresso, setProgresso] = useState({});
        const [nivel, setNivel] = useState(null);
        const [diagnostico, setDiagnostico] = useState({ i: 0, acertos: 0, respostas: [] });
        const [quiz, setQuiz] = useState({ i: 0, acertos: 0, resp: null, feedback: null });
        const [dificuldade, setDificuldade] = useState(\"media\");
        const [revisaoPendente, setRevisaoPendente] = useState([]);

        const MODULOS = useMemo(
          () => [
            { id: \"preparacao\", nome: \"Preparação\", icone: Settings, cor: \"from-indigo-500 to-purple-600\" },
            { id: \"fundamentos\", nome: \"Fundamentos\", icone: Crown, cor: \"from-amber-500 to-orange-600\" },
            { id: \"economia\", nome: \"Economia\", icone: Building, cor: \"from-emerald-500 to-teal-600\" },
            { id: \"guerra\", nome: \"Guerra\", icone: Swords, cor: \"from-rose-500 to-pink-600\" },
            { id: \"intriga\", nome: \"Intriga\", icone: Brain, cor: \"from-fuchsia-500 to-violet-600\" },
            { id: \"religiao\", nome: \"Religião & Cultura\", icone: Church, cor: \"from-sky-500 to-cyan-600\" },
            { id: \"dinastia\", nome: \"Dinastia & Sucessão\", icone: Network, cor: \"from-slate-500 to-gray-700\" },
          ],
          []
        );

        useEffect(() => {
          if (!moduloAtivo || quiz.i === 0) return;
          if (quiz.i % 3 !== 0) return;
          const taxa = quiz.acertos / quiz.i;

          setDificuldade((nivelAtual) => {
            if (taxa >= 0.8 && nivelAtual !== \"dificil\") {
              return nivelAtual === \"facil\" ? \"media\" : \"dificil\";
            }
            if (taxa < 0.5 && nivelAtual !== \"facil\") {
              return nivelAtual === \"dificil\" ? \"media\" : \"facil\";
            }
            return nivelAtual;
          });
        }, [quiz.i, quiz.acertos, moduloAtivo]);

        const iniciarDiagnostico = () => {
          setTela(\"diagnostico\");
          setDiagnostico({ i: 0, acertos: 0, respostas: [] });
        };

        const responderDiagnostico = (idx) => {
          const cur = QUIZ.diagnostico[diagnostico.i];
          const correto = idx === cur.c;
          const novo = {
            i: diagnostico.i + 1,
            acertos: diagnostico.acertos + (correto ? 1 : 0),
            respostas: [...diagnostico.respostas, { certo: correto }],
          };

          if (novo.i >= QUIZ.diagnostico.length) {
            const pct = novo.acertos / QUIZ.diagnostico.length;
            const lvl = pct >= 0.8 ? \"avancado\" : pct >= 0.6 ? \"intermediario\" : \"iniciante\";
            setNivel(lvl);
            setTela(\"resultado-diagnostico\");
            setDiagnostico(novo);
          } else {
            setDiagnostico(novo);
          }
        };

        const abrirModulo = (id) => {
          setModuloAtivo(id);
          setTela(\"licao\");
          setPasso(0);
          setQuiz({ i: 0, acertos: 0, resp: null, feedback: null });

          if (nivel === \"avancado\") setDificuldade(\"dificil\");
          else if (nivel === \"intermediario\") setDificuldade(\"media\");
          else setDificuldade(\"facil\");
        };

        const concluirModulo = (desempenho = 0.7) => {
          const estrelas = Math.max(1, Math.round(desempenho * 5));
          setProgresso((prev) => ({ ...prev, [moduloAtivo]: { feito: true, estrelas } }));

          if (desempenho < 0.8) {
            setRevisaoPendente((lista) => Array.from(new Set([...lista, moduloAtivo])));
          } else {
            setRevisaoPendente((lista) => lista.filter((m) => m !== moduloAtivo));
          }

          setTela(\"modulo-concluido\");
        };

        const enviarRespostaQuiz = (idx) => {
          const banco = QUIZ[moduloAtivo] || [];
          const cur = banco[quiz.i];
          if (!cur) {
            concluirModulo(quiz.i === 0 ? 0 : quiz.acertos / quiz.i);
            return;
          }

          const correto = idx === cur.c;
          const feedback = correto
            ? { tipo: \"ok\", titulo: \"Perfeito!\", texto: cur.exp }
            : { tipo: \"erro\", titulo: \"Quase lá!\", texto: cur.exp };

          setQuiz((prev) => ({
            i: prev.i + 1,
            acertos: prev.acertos + (correto ? 1 : 0),
            resp: idx,
            feedback,
          }));
        };

        const proximaQuestao = () => {
          const banco = QUIZ[moduloAtivo] || [];
          if (quiz.i >= banco.length) {
            concluirModulo(quiz.i === 0 ? 0 : quiz.acertos / quiz.i);
            return;
          }

          setQuiz((prev) => ({ ...prev, resp: null, feedback: null }));
        };

        const Header = () => (
          <header className=\"sticky top-0 z-40 backdrop-blur-lg bg-gradient-to-r from-indigo-600/95 via-violet-600/95 to-purple-600/95 text-white px-6 py-4 shadow-lg shadow-indigo-400/30\">
            <div className=\"max-w-6xl mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-4\">
              <div className=\"flex items-center gap-3\">
                <div className=\"p-2 rounded-xl bg-white/20 shadow-inner\">
                  <Castle className=\"w-6 h-6\" />
                </div>
                <div>
                  <span className=\"font-bold tracking-wide text-lg\">Academia de Reis — Instrutor Mestre CK3</span>
                  <p className=\"text-xs text-white/80\">Aprenda Crusader Kings 3 com táticas guiadas, checklists e simulações.</p>
                </div>
              </div>
              <div className=\"flex flex-wrap items-center gap-3 text-sm opacity-95\">
                <div className=\"flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-full\">
                  <Star className=\"w-4 h-4\" />
                  <span>Nível: {nivel ? nivel : \"—\"}</span>
                </div>
                <div className=\"flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-full\">
                  <Target className=\"w-4 h-4\" />
                  <span>Dificuldade: {dificuldade}</span>
                </div>
              </div>
            </div>
          </header>
        );

        const PainelModulos = () => (
          <div className=\"grid gap-6 md:grid-cols-2 xl:grid-cols-3\">
            {MODULOS.map((m, idx) => {
              const Icone = m.icone;
              const bloqueado = idx > 0 && !progresso[MODULOS[idx - 1].id]?.feito;
              return (
                <Card
                  key={m.id}
                  className={`transition-all duration-500 hover:-translate-y-1 hover:shadow-2xl ${
                    bloqueado ? \"opacity-60\" : \"\"
                  }`}
                >
                  <div className=\"flex items-center gap-3 mb-5\">
                    <div className={`p-2 rounded-xl bg-gradient-to-br ${m.cor} text-white shadow-lg shadow-indigo-200/70`}>
                      <Icone className=\"w-6 h-6\" />
                    </div>
                    <div className=\"flex-1\">
                      <h4 className=\"font-bold text-slate-900 text-lg\">{m.nome}</h4>
                      <p className=\"text-xs text-slate-500\">{LESSONS[m.id].titulo}</p>
                    </div>
                    {progresso[m.id]?.feito ? (
                      <CheckCircle2 className=\"w-5 h-5 text-emerald-500\" />
                    ) : (
                      <Lock className=\"w-5 h-5 text-slate-300\" />
                    )}
                  </div>
                  <div className=\"mb-4\">
                    <ProgressBar value={(progresso[m.id]?.estrelas || 0) * 20} />
                  </div>
                  <div className=\"flex items-center justify-between text-sm\">
                    <div className=\"flex items-center gap-2 text-slate-600\">
                      <Star className={`w-4 h-4 ${progresso[m.id]?.feito ? \"text-yellow-500\" : \"text-slate-300\"}`} />
                      <span>{progresso[m.id]?.estrelas || 0} / 5</span>
                    </div>
                    <button
                      disabled={bloqueado}
                      onClick={() => abrirModulo(m.id)}
                      className={`px-3 py-1.5 rounded-lg font-semibold text-white transition shadow-lg ${
                        bloqueado
                          ? \"bg-slate-300 cursor-not-allowed shadow-none\"
                          : \"bg-indigo-600 hover:bg-indigo-700 focus:ring-2 focus:ring-offset-2 focus:ring-indigo-400\"
                      }`}
                    >
                      {progresso[m.id]?.feito ? \"Revisar\" : \"Começar\"}
                    </button>
                  </div>
                </Card>
              );
            })}
          </div>
        );

        const Licao = () => {
          const dados = LESSONS[moduloAtivo];
          const passoAtual = dados.passos[passo];
          const podeVoltar = passo > 0;
          const podeAvancar = passo < dados.passos.length - 1;

          return (
            <Card>
              <SectionTitle icon={BookOpen} title={`Lição: ${dados.titulo}`} subtitle=\"Explique, demonstre e execute no jogo\" />
              <div className=\"space-y-5\">
                <div>
                  <h4 className=\"font-semibold text-lg text-slate-900\">{passoAtual.titulo}</h4>
                  <ul className=\"list-disc ml-6 text-slate-700 mt-3 space-y-1\">
                    {passoAtual.acao.map((acao, index) => (
                      <li key={index} className=\"leading-relaxed\">{acao}</li>
                    ))}
                  </ul>
                  {passoAtual.dica && (
                    <div className=\"mt-4 text-sm bg-indigo-50 border border-indigo-200 text-indigo-800 px-4 py-3 rounded-xl flex gap-2\">
                      <Sparkles className=\"w-4 h-4 mt-0.5\" />
                      <span>{passoAtual.dica}</span>
                    </div>
                  )}
                </div>
                <div className=\"flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pt-2\">
                  <button
                    onClick={() => setPasso((p) => Math.max(0, p - 1))}
                    disabled={!podeVoltar}
                    className={`flex items-center justify-center gap-2 px-3 py-2 rounded-lg border border-slate-200 font-medium text-sm transition ${
                      podeVoltar ? \"hover:bg-slate-50 hover:border-slate-300\" : \"opacity-50 cursor-not-allowed\"
                    }`}
                  >
                    <ArrowLeft className=\"w-4 h-4\" />
                    Anterior
                  </button>
                  {podeAvancar ? (
                    <button
                      onClick={() => setPasso((p) => p + 1)}
                      className=\"flex items-center justify-center gap-2 px-4 py-2 rounded-lg bg-indigo-600 text-white font-semibold text-sm shadow-lg shadow-indigo-300/40 hover:bg-indigo-700 focus:ring-2 focus:ring-offset-2 focus:ring-indigo-400\"
                    >
                      Próximo
                      <ArrowRight className=\"w-4 h-4\" />
                    </button>
                  ) : (
                    <button
                      onClick={() => setTela(\"pratica\")}
                      className=\"flex items-center justify-center gap-2 px-4 py-2 rounded-lg bg-emerald-600 text-white font-semibold text-sm shadow-lg shadow-emerald-300/40 hover:bg-emerald-700 focus:ring-2 focus:ring-offset-2 focus:ring-emerald-400\"
                    >
                      Pronto! Vamos Praticar
                      <Sword className=\"w-4 h-4\" />
                    </button>
                  )}
                </div>
              </div>
              <div className=\"mt-6\">
                <SectionTitle icon={CheckCircle2} title=\"Checklist do Módulo\" />
                <div className=\"flex flex-wrap gap-2\">
                  {LESSONS[moduloAtivo].checklist.map((item, index) => (
                    <Tag key={index}>{item}</Tag>
                  ))}
                </div>
              </div>
            </Card>
          );
        };

        const Pratica = () => {
          const banco = QUIZ[moduloAtivo] || [];
          const cur = banco[quiz.i];
          if (!cur) {
            return (
              <Card>
                <SectionTitle icon={Trophy} title=\"Módulo concluído (prática)\" subtitle=\"Hora de consolidar\" />
                <div className=\"space-y-3\">
                  <p className=\"text-slate-700\">Você concluiu as questões deste módulo.</p>
                  <button
                    onClick={() => concluirModulo(quiz.i === 0 ? 0 : quiz.acertos / quiz.i)}
                    className=\"px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 focus:ring-2 focus:ring-offset-2 focus:ring-indigo-400\"
                  >
                    Finalizar módulo
                  </button>
                </div>
              </Card>
            );
          }

          return (
            <Card>
              <SectionTitle icon={Target} title=\"Prática guiada\" subtitle={`Dificuldade: ${dificuldade}`} />
              <div className=\"space-y-4\">
                <div className=\"text-slate-900 text-lg font-semibold\">{cur.q}</div>
                <div className=\"grid md:grid-cols-2 gap-3\">
                  {cur.a.map((alt, index) => (
                    <button
                      key={index}
                      onClick={() => enviarRespostaQuiz(index)}
                      disabled={quiz.resp !== null}
                      className={`text-left px-4 py-3 rounded-xl border border-slate-200 transition text-sm font-medium ${
                        quiz.resp === null ? \"hover:bg-slate-50\" : \"opacity-70\"
                      }`}
                    >
                      {alt}
                    </button>
                  ))}
                </div>
                {quiz.feedback && (
                  <div
                    className={`p-3 rounded-xl border ${
                      quiz.feedback.tipo === \"ok\"
                        ? \"bg-emerald-50 border-emerald-200 text-emerald-800\"
                        : \"bg-amber-50 border-amber-200 text-amber-800\"
                    }`}
                  >
                    <div className=\"font-semibold mb-1\">{quiz.feedback.titulo}</div>
                    <div className=\"text-sm\">{quiz.feedback.texto}</div>
                    <button
                      onClick={proximaQuestao}
                      className=\"mt-3 px-3 py-1.5 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700\"
                    >
                      Próximo
                    </button>
                  </div>
                )}
              </div>
              <div className=\"mt-6 text-sm text-slate-600 flex items-center gap-4\">
                <Pill>Questão {quiz.i + 1} / {banco.length}</Pill>
                <Pill>Acertos: {quiz.acertos}</Pill>
              </div>
            </Card>
          );
        };

        const RevisaoAdaptativa = () => (
          <Card>
            <SectionTitle
              icon={ShieldQuestion}
              title=\"Revisão Adaptativa\"
              subtitle=\"Se você não atingiu 80% em um módulo, ele aparece aqui para reforço dirigido.\"
            />
            {revisaoPendente.length === 0 ? (
              <p className=\"text-slate-700\">Você não possui revisões pendentes. Bom trabalho!</p>
            ) : (
              <div className=\"grid md:grid-cols-2 gap-3 mt-3\">
                {revisaoPendente.map((id) => (
                  <button
                    key={id}
                    onClick={() => abrirModulo(id)}
                    className=\"text-left p-4 rounded-xl border hover:bg-slate-50 transition\"
                  >
                    <div className=\"font-semibold\">{LESSONS[id].titulo}</div>
                    <div className=\"text-xs text-slate-500\">Clique para reforçar os pontos fracos</div>
                  </button>
                ))}
              </div>
            )}
          </Card>
        );

        if (tela === \"boasvindas\")
          return (
            <div className=\"min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 text-white\">
              <Header />
              <div className=\"max-w-4xl mx-auto p-6 text-center space-y-6\">
                <div className=\"mb-6 animate-bounce\">
                  <Sparkles className=\"w-16 h-16 mx-auto\" />
                </div>
                <div className=\"space-y-3\">
                  <h1 className=\"text-4xl font-extrabold\">Bem-vindo à Academia de Reis</h1>
                  <p className=\"text-lg text-white/90\">
                    Do primeiro clique ao domínio total de Crusader Kings 3. Método avançado, prático e 100% em português.
                  </p>
                </div>
                <div className=\"flex flex-wrap items-center justify-center gap-3\">
                  <button
                    onClick={iniciarDiagnostico}
                    className=\"px-6 py-3 rounded-2xl bg-yellow-400 text-indigo-900 font-bold hover:scale-105 transition shadow-lg shadow-yellow-500/50\"
                  >
                    Iniciar Diagnóstico
                  </button>
                  <button
                    onClick={() => setTela(\"grade\")}
                    className=\"px-6 py-3 rounded-2xl bg-white/10 border border-white/30 hover:bg-white/20 transition\"
                  >
                    Ver Módulos
                  </button>
                </div>
                <Card className=\"bg-white/10 backdrop-blur border-white/20 text-white text-left\">
                  <SectionTitle icon={HelpCircle} title=\"Como funciona\" />
                  <ul className=\"list-disc ml-6 text-sm space-y-1 text-white/90\">
                    <li>Explique + mostre + peça ação (clique a clique).</li>
                    <li>Filtros e botões com os nomes oficiais do jogo em PT-BR.</li>
                    <li>Active recall ao final de cada módulo.</li>
                    <li>Simulações de erros comuns com correções guiadas.</li>
                    <li>Gating: novos módulos liberam após dominar os anteriores.</li>
                  </ul>
                </Card>
              </div>
            </div>
          );

        if (tela === \"diagnostico\") {
          const cur = QUIZ.diagnostico[diagnostico.i];
          return (
            <div className=\"min-h-screen bg-slate-50\">
              <Header />
              <div className=\"max-w-3xl mx-auto p-6\">
                <Card>
                  <SectionTitle
                    icon={Target}
                    title=\"Teste de Diagnóstico\"
                    subtitle={`Questão ${diagnostico.i + 1} de ${QUIZ.diagnostico.length}`}
                  />
                  <div className=\"text-lg font-semibold text-slate-900\">{cur.q}</div>
                  <div className=\"grid md:grid-cols-2 gap-3 mt-4\">
                    {cur.a.map((alt, i) => (
                      <button
                        key={i}
                        onClick={() => responderDiagnostico(i)}
                        className=\"text-left px-4 py-3 rounded-xl border border-slate-200 hover:bg-slate-50 transition\"
                      >
                        {alt}
                      </button>
                    ))}
                  </div>
                </Card>
              </div>
            </div>
          );
        }

        if (tela === \"resultado-diagnostico\") {
          const pct = (diagnostico.acertos / QUIZ.diagnostico.length) * 100;
          return (
            <div className=\"min-h-screen bg-slate-50\">
              <Header />
              <div className=\"max-w-3xl mx-auto p-6\">
                <Card className=\"text-center\">
                  <Trophy className=\"w-16 h-16 text-yellow-500 mx-auto mb-2\" />
                  <div className=\"text-5xl font-extrabold text-slate-900\">{pct.toFixed(0)}%</div>
                  <div className=\"mt-2 text-slate-700\">
                    Nível inicial: <b>{nivel}</b>
                  </div>
                  <div className=\"mt-6 flex flex-wrap items-center justify-center gap-2\">
                    <button
                      onClick={() => setTela(\"grade\")}
                      className=\"px-5 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700\"
                    >
                      Explorar Módulos
                    </button>
                    <button
                      onClick={() => abrirModulo(\"preparacao\")}
                      className=\"px-5 py-2 rounded-lg border border-slate-200 hover:bg-slate-50\"
                    >
                      Começar pela Preparação
                    </button>
                  </div>
                </Card>
              </div>
            </div>
          );
        }

        if (tela === \"grade\")
          return (
            <div className=\"min-h-screen bg-slate-50\">
              <Header />
              <div className=\"max-w-6xl mx-auto p-6 space-y-6\">
                <PainelModulos />
                <RevisaoAdaptativa />
                <Card>
                  <SectionTitle icon={Layers} title=\"Checkpoints de Mestre\" />
                  <div className=\"grid md:grid-cols-3 gap-3\">
                    {CHECKPOINTS.map((ck, i) => (
                      <div key={i} className=\"p-3 rounded-xl border border-slate-200 bg-white/60\">
                        <div className=\"text-sm text-slate-500\">{ck.tempo}</div>
                        <ul className=\"list-disc ml-5 text-sm text-slate-800 mt-1 space-y-1\">
                          {ck.metas.map((m, j) => (
                            <li key={j}>{m}</li>
                          ))}
                        </ul>
                      </div>
                    ))}
                  </div>
                </Card>
              </div>
            </div>
          );

        if (tela === \"licao\" || tela === \"pratica\") {
          const modulo = MODULOS.find((m) => m.id === moduloAtivo);
          if (!modulo) return null;
          return (
            <div className=\"min-h-screen bg-slate-50\">
              <Header />
              <div className=\"max-w-5xl mx-auto p-6 space-y-6\">
                <div className=\"flex flex-wrap items-center gap-3\">
                  <button
                    onClick={() => setTela(\"grade\")}
                    className=\"px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-white transition\"
                  >
                    <ArrowLeft className=\"w-4 h-4\" />
                  </button>
                  <div className={`p-2 rounded-xl text-white bg-gradient-to-br ${modulo.cor}`}>
                    <modulo.icone className=\"w-5 h-5\" />
                  </div>
                  <div className=\"text-xl font-bold text-slate-900\">{modulo.nome}</div>
                  <Pill>Dificuldade: {dificuldade}</Pill>
                </div>
                {tela === \"licao\" ? <Licao /> : <Pratica />}
                <Card>
                  <SectionTitle
                    icon={AlertTriangle}
                    title=\"Simulações de Erro\"
                    subtitle=\"Pratique o erro de forma segura e corrija-o em seguida\"
                  />
                  <div className=\"grid md:grid-cols-3 gap-3\">
                    {Object.values(ERROR_SIMULATIONS).map((e, i) => (
                      <div key={i} className=\"p-4 rounded-xl border border-slate-200 bg-white/70\">
                        <div className=\"font-semibold text-slate-900\">{e.titulo}</div>
                        <ol className=\"list-decimal ml-5 text-sm text-slate-700 mt-2 space-y-1\">
                          {e.passos.map((p, j) => (
                            <li key={j}>{p}</li>
                          ))}
                        </ol>
                      </div>
                    ))}
                  </div>
                </Card>
              </div>
            </div>
          );
        }

        if (tela === \"modulo-concluido\") {
          const estrelas = progresso[moduloAtivo]?.estrelas || 0;
          return (
            <div className=\"min-h-screen bg-slate-50\">
              <Header />
              <div className=\"max-w-3xl mx-auto p-6\">
                <Card className=\"text-center\">
                  <Trophy className=\"w-16 h-16 text-yellow-500 mx-auto\" />
                  <h3 className=\"text-2xl font-bold mt-2 text-slate-900\">Módulo concluído!</h3>
                  <div className=\"flex items-center justify-center gap-1 my-3\">
                    {[...Array(5)].map((_, i) => (
                      <Star
                        key={i}
                        className={`w-6 h-6 ${
                          i < estrelas ? \"text-yellow-400 fill-yellow-400\" : \"text-slate-300\"
                        }`}
                      />
                    ))}
                  </div>
                  <div className=\"mt-4 flex flex-wrap items-center justify-center gap-2\">
                    <button
                      onClick={() => setTela(\"grade\")}
                      className=\"px-5 py-2 rounded-lg border border-slate-200 hover:bg-slate-50\"
                    >
                      Voltar aos módulos
                    </button>
                    <button
                      onClick={() => abrirModulo(moduloAtivo)}
                      className=\"px-5 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700\"
                    >
                      Refazer para 5★
                    </button>
                  </div>
                </Card>
              </div>
            </div>
          );
        }

        return null;
      }


      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<AcademiaCK3 />);
    </script>
  </body>
</html>
