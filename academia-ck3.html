      html,

        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,

      body {
        background: radial-gradient(
          circle at top left,
          #ede9fe,
          #f5f3ff 40%,

        color: #0f172a;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.84);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(148, 163, 184, 0.18);
      }

      .fancy-gradient {
        background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
      }

      .emoji-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.5rem;
        height: 1.5rem;
        font-size: 1.25rem;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.18), transparent 45%),
          radial-gradient(circle at 80% 0%, rgba(236, 72, 153, 0.16), transparent 50%),
          radial-gradient(circle at 30% 80%, rgba(14, 165, 233, 0.15), transparent 55%);
        pointer-events: none;
        z-index: -2;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background-image: linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.05) 0%,
            rgba(255, 255, 255, 0) 50%,
            rgba(255, 255, 255, 0.05) 100%
          ),

        background-size: 240px, cover;
        background-position: center;
        opacity: 0.12;
        filter: saturate(120%);
        mix-blend-mode: screen;
        pointer-events: none;
        z-index: -3;
      }

      .holo-card {
        position: relative;
        border-radius: 1.5rem;
        background: rgba(248, 250, 252, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.35);
        box-shadow: 0 40px 80px rgba(79, 70, 229, 0.08);
        overflow: hidden;
      }

      .holo-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, rgba(99, 102, 241, 0.2), transparent 45%),
          linear-gradient(-140deg, rgba(236, 72, 153, 0.2), transparent 55%);
        opacity: 0.7;
        pointer-events: none;
      }

      .holo-card > * {
        position: relative;
        z-index: 1;
      }

      .hud-tile {
        border-radius: 1rem;
        background: linear-gradient(145deg, rgba(15, 23, 42, 0.92), rgba(37, 99, 235, 0.85));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 20px 35px rgba(15, 23, 42, 0.35);
        color: #f8fafc;
        padding: 1rem;
        position: relative;
      }

      .hud-tile::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        border: 1px solid rgba(255, 255, 255, 0.08);
        pointer-events: none;
      }

      .hud-meter {
        height: 0.4rem;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.22);
        overflow: hidden;
        margin-top: 0.75rem;
      }

      .hud-meter span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #38bdf8, #22d3ee);
      }

      .tab-button {
        border-radius: 9999px;
        padding: 0.55rem 1.3rem;
        border: 1px solid rgba(99, 102, 241, 0.15);
        background: rgba(255, 255, 255, 0.65);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
        color: #4338ca;
      }

      .tab-button[data-active="true"] {
        background: linear-gradient(120deg, rgba(129, 140, 248, 0.85), rgba(236, 72, 153, 0.85));
        color: white;
        border-color: transparent;
        box-shadow: 0 12px 25px rgba(99, 102, 241, 0.25);
      }

      .intel-card {
        border-radius: 1rem;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.35);
        padding: 1rem;
        color: rgba(226, 232, 240, 0.92);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.45);
      }

      .intel-card strong {
        color: #38bdf8;
      }

      .event-entry {
        border-radius: 1rem;
        padding: 0.75rem 1rem;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(255, 255, 255, 0.75);
        display: grid;
        gap: 0.35rem;
      }

      .event-entry[data-type="alerta"] {
        border-color: rgba(248, 113, 113, 0.35);
        background: rgba(254, 242, 242, 0.9);
        color: #991b1b;
      }

      .event-entry[data-type="sucesso"] {
        border-color: rgba(16, 185, 129, 0.35);
        background: rgba(236, 253, 245, 0.95);
        color: #065f46;
      }

      .decision-button {
        border-radius: 0.9rem;
        border: 1px solid rgba(99, 102, 241, 0.2);
        background: linear-gradient(135deg, rgba(199, 210, 254, 0.35), rgba(59, 130, 246, 0.25));
        padding: 0.6rem 1rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .decision-button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 18px 30px rgba(99, 102, 241, 0.25);
      }

      .decision-button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .floating-spark {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.6);
        animation: spark 6s linear infinite;
      }

      @keyframes spark {
        from {
          transform: translate3d(0, 0, 0) scale(1);
          opacity: 0.8;
        }
        to {
          transform: translate3d(120px, -220px, 0) scale(0);
          opacity: 0;
        }
      }

      function formatarNumero(valor) {
        return Math.round(valor).toLocaleString("pt-BR");

      function percentual(valor, maximo) {
        if (!maximo) return 0;
        return Math.min(100, Math.max(0, (valor / maximo) * 100));

      function registrarEvento(texto, tipo = "info") {
        const tempo = new Date().toLocaleTimeString("pt-BR", {
          hour: "2-digit",
          minute: "2-digit",
        });
        state.eventos = [{ texto, tipo, tempo }, ...state.eventos].slice(0, 7);

      function ajustarHud(delta = {}) {
        const hud = state.hud;
        if (typeof delta.ouro === "number") {
          hud.ouro = Math.min(hud.maxOuro, Math.max(0, hud.ouro + delta.ouro));
        }
        if (typeof delta.prestigio === "number") {
          hud.prestigio = Math.min(
            hud.maxPrestigio,
            Math.max(0, hud.prestigio + delta.prestigio)
          );
        }
        if (typeof delta.piedade === "number") {
          hud.piedade = Math.min(
            hud.maxPiedade,
            Math.max(0, hud.piedade + delta.piedade)
          );
        }
        if (typeof delta.tropas === "number") {
          hud.tropas = Math.min(hud.maxTropas, Math.max(0, hud.tropas + delta.tropas));
        }
        if (typeof delta.estresse === "number") {
          hud.estresse = Math.min(100, Math.max(0, hud.estresse + delta.estresse));
        }
      }

      function executarDecisao(id) {
        const decisao = DECISOES.find((d) => d.id === id);
        if (!decisao) return;
        const custo = decisao.custo || 0;
        if (custo > 0 && state.hud.ouro < custo) {
          registrarEvento(
            `Tesouro insuficiente para executar '${decisao.titulo}'. Reforce sua economia primeiro.`,

        ajustarHud({ ...decisao.efeitos });
        registrarEvento(decisao.textoSucesso, "sucesso");
        render();

        const pergunta = QUIZ.diagnostico[state.diagnostico.i];
        if (!pergunta) return;
        if (idx === pergunta.c) {
          state.diagnostico.acertos += 1;
        }
        state.diagnostico.i += 1;
        if (state.diagnostico.i >= QUIZ.diagnostico.length) {
          const pct = state.diagnostico.acertos / QUIZ.diagnostico.length;
          state.nivel = pct >= 0.8 ? "avançado" : pct >= 0.6 ? "intermediário" : "iniciante";
          state.tela = "resultado-diagnostico";
        }
        render();
      }

      function abrirModulo(id) {
        state.moduloAtivo = id;
        state.tela = "licao";
        state.passo = 0;
        state.quiz = { i: 0, acertos: 0, respondeu: false, feedback: null, selecionada: null };
        if (state.nivel === "avançado") state.dificuldade = "difícil";
        else if (state.nivel === "intermediário") state.dificuldade = "média";
        else state.dificuldade = "fácil";
        render();
      }

      function irParaPratica() {
        state.tela = "pratica";
        render();
      }

      function responderQuiz(idx) {
        if (state.quiz.respondeu) return;
        const banco = QUIZ[state.moduloAtivo] || [];
        const pergunta = banco[state.quiz.i];
        if (!pergunta) return;
        const correto = idx === pergunta.c;
        if (correto) state.quiz.acertos += 1;
        state.quiz.respondeu = true;
        state.quiz.selecionada = idx;
        state.quiz.feedback = {
          correto,
          texto: pergunta.exp,
        };
        atualizarDificuldade();
        render();
      }

      function atualizarDificuldade() {
        const respondidas = state.quiz.i + 1;
        if (respondidas % 3 !== 0) return;
        const taxa = state.quiz.acertos / respondidas;
        if (taxa >= 0.8 && state.dificuldade !== "difícil") {
          state.dificuldade = state.dificuldade === "fácil" ? "média" : "difícil";
        }
        if (taxa < 0.5 && state.dificuldade !== "fácil") {
          state.dificuldade = state.dificuldade === "difícil" ? "média" : "fácil";
        }
      }

      function proximaQuestao() {
        const banco = QUIZ[state.moduloAtivo] || [];
        if (!banco.length || state.quiz.i >= banco.length - 1) {
          concluirModulo();
          return;
        }
        state.quiz.i += 1;
        state.quiz.respondeu = false;
        state.quiz.feedback = null;
        state.quiz.selecionada = null;
        render();
      }

      function concluirModulo() {
        const banco = QUIZ[state.moduloAtivo] || [];
        const respondidas = Math.max(1, state.quiz.i + (state.quiz.respondeu ? 1 : 0));
        const desempenho = state.quiz.acertos / respondidas;
        const estrelas = Math.max(1, Math.round(desempenho * 5));
        state.progresso[state.moduloAtivo] = { feito: true, estrelas };
        if (desempenho < 0.8 && !state.revisao.includes(state.moduloAtivo)) {
          state.revisao.push(state.moduloAtivo);
        }
        if (desempenho >= 0.8) {
          state.revisao = state.revisao.filter((m) => m !== state.moduloAtivo);
        }
        const bonusBase = { ouro: 40, prestigio: 55, piedade: 20, tropas: 80, estresse: -4 };
        const ajustes = {
          preparacao: { prestigio: 25, tropas: 60 },
          fundamentos: { prestigio: 35 },
          economia: { ouro: 120, prestigio: 15 },
          guerra: { tropas: 260, prestigio: 60 },
          intriga: { prestigio: 45 },
          religiao: { piedade: 90, estresse: -6 },
          dinastia: { prestigio: 80, piedade: 35 },
        };
        const bonus = { ...bonusBase };
        const extra = ajustes[state.moduloAtivo] || {};
        Object.entries(extra).forEach(([key, val]) => {
          bonus[key] = (bonus[key] || 0) + val;
        });
        ajustarHud(bonus);
        registrarEvento(
          `${LESSONS[state.moduloAtivo].titulo} concluído com ${estrelas}★. Recursos do reino atualizados.`,
          desempenho >= 0.8 ? "sucesso" : "info"
        );
        state.tela = "modulo-concluido";
        render();
      }

                      <div class="hud-tile">
                        <div class="flex items-center justify-between text-sm">
                          <span class="text-white/70">Próxima decisão</span>
                          <span class="text-purple-200 font-semibold">Conselho de Estratégia</span>
                        </div>
                        <div class="hud-meter"><span style="width: 80%; background: linear-gradient(90deg, #a855f7, #6366f1);"></span></div>
                        <div class="mt-2 text-xs text-white/60">Melhore contratos e claims</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </main>
          </div>
        `;
      }

      function renderPainelReino() {
        const tabs = PAINEL_TABS.map(
          (tab) => `
            <button data-action="mudar-painel" data-painel="${tab.id}" class="tab-button" data-active="${
              state.painelReino === tab.id
            }">
              <span>${tab.emoji}</span>
              <span>${tab.titulo}</span>
            </button>
          `
        ).join(" ");

        const concluidos = Object.values(state.progresso).filter((p) => p?.feito).length;
        const totalEstrelas = Object.values(state.progresso).reduce(
          (acc, cur) => acc + (cur?.estrelas || 0),
          0
        );
        const mediaEstrelas = concluidos ? (totalEstrelas / concluidos).toFixed(1) : "0.0";
        const proximoModulo = MODULOS.find((m) => !state.progresso[m.id]?.feito);
        const proximoNome = proximoModulo ? LESSONS[proximoModulo.id].titulo : "Todos concluídos";
        const progressoPercentual = Math.round((concluidos / MODULOS.length) * 100);

        let conteudo = "";
        if (state.painelReino === "status") {
          conteudo = `
            <div class="grid gap-4 md:grid-cols-3 text-white/90">
              <div class="intel-card">
                <div class="text-xs uppercase tracking-widest text-sky-200/80">Progresso geral</div>
                <div class="text-2xl font-semibold">${concluidos}/${MODULOS.length} módulos</div>
                <p class="text-sm text-slate-200/80">Conclusão ${progressoPercentual}% do plano mestre.</p>
              </div>
              <div class="intel-card">
                <div class="text-xs uppercase tracking-widest text-emerald-200/80">Qualidade</div>
                <div class="text-2xl font-semibold">${mediaEstrelas} ★</div>
                <p class="text-sm text-slate-200/80">Média das estrelas obtidas por módulo concluído.</p>
              </div>
              <div class="intel-card">
                <div class="text-xs uppercase tracking-widest text-fuchsia-200/80">Próxima prioridade</div>
                <div class="text-lg font-semibold">${proximoNome}</div>
                <p class="text-sm text-slate-200/80">Desbloqueia novos painéis e decisões especiais.</p>
              </div>
            </div>
            <div class="grid gap-4 md:grid-cols-2 text-white/90">
              <div class="intel-card">
                <strong>Revisões pendentes:</strong>
                <p class="text-sm mt-1">${
                  state.revisao.length
                    ? `${state.revisao.length} módulo(s) aguardando reforço.`
                    : "Nenhuma revisão necessária. Continue avançando!"
                }</p>
              </div>
              <div class="intel-card">
                <strong>Eventos recentes:</strong>
                <p class="text-sm mt-1">${state.eventos[0]?.texto || "Complete um módulo para gerar relatórios dinásticos."}</p>
              </div>
            </div>
          `;
        } else if (state.painelReino === "economia") {
          const receita = Math.round(state.hud.ouro / 12) + 18;
          const manutencao = Math.round(state.hud.tropas / 75) + 25;
          conteudo = `
            <div class="grid gap-4 md:grid-cols-3 text-white/90">
              <div class="intel-card">
                <div class="text-xs uppercase tracking-widest text-amber-200/80">Receita mensal</div>
                <div class="text-2xl font-semibold">${formatarNumero(receita)} ouro</div>
                <p class="text-sm text-slate-200/80">Estimativa com base em impostos atuais e contratos revisados.</p>
              </div>
              <div class="intel-card">
                <div class="text-xs uppercase tracking-widest text-rose-200/80">Manutenção militar</div>
                <div class="text-2xl font-semibold">${formatarNumero(manutencao)} ouro</div>
                <p class="text-sm text-slate-200/80">Inclui homens de armas, campeões e guardas pessoais.</p>
              </div>
              <div class="intel-card">
                <div class="text-xs uppercase tracking-widest text-emerald-200/80">Projetos ativos</div>
                <div class="text-lg font-semibold">${
                  state.progresso.economia?.feito ? "Construções avançadas liberadas" : "Economia básica em curso"
                }</div>
                <p class="text-sm text-slate-200/80">Gerencie fazendas, portos e tributos urbanos para crescer.</p>
              </div>
            </div>
            <div class="intel-card text-white/90">
              <strong>Recomendações do conselho:</strong>
              <ul class="list-disc ml-5 text-sm mt-2 space-y-1">
                <li>Finalize ao menos um prédio econômico antes de declarar novas guerras.</li>
                <li>Ajuste contratos com ganchos obtidos em Intriga para reforçar o tesouro.</li>
                <li>Mantenha ${formatarNumero(Math.max(200, state.hud.ouro))} de ouro reservado para emergências.</li>
              </ul>
            </div>
          `;
        } else {
          const aliados = ALIADOS.map(
            (aliado) => `
              <div class="flex items-start gap-3">
                <div class="text-2xl">${aliado.powerUp ? "✨" : "🤝"}</div>
                <div>
                  <div class="font-semibold text-white">${aliado.nome}</div>
                  <div class="text-xs text-white/70 uppercase tracking-widest">${aliado.relacao} · Força ${aliado.poder}</div>
                  <p class="text-sm text-white/80">${aliado.comentario}</p>
                </div>
              </div>
            `
          ).join("<hr class='border-white/10 my-3' />");

          const rumores = RUMORES.map((rumor) => `<li>${rumor}</li>`).join("");

          conteudo = `
            <div class="grid gap-4 md:grid-cols-2 text-white/90">
              <div class="intel-card space-y-3">
                <div class="text-xs uppercase tracking-widest text-emerald-200/80">Rede de aliados</div>
                ${aliados}
              </div>
              <div class="intel-card">
                <div class="text-xs uppercase tracking-widest text-sky-200/80">Rumores e intrigas</div>
                <ul class="list-disc ml-4 text-sm space-y-2 mt-2">${rumores}</ul>
              </div>
            </div>
          `;
        }

        return `
          <section class="holo-card p-6 space-y-6 relative overflow-hidden">
            <div class="flex flex-wrap gap-3">${tabs}</div>
            ${conteudo}
          </section>
        `;
      }

      function renderDecisionConsole() {
        const cards = DECISOES.map((decisao) => {
          const bloqueado = decisao.custo > 0 && state.hud.ouro < decisao.custo;
          return `
            <div class="glass-card rounded-3xl p-5 space-y-3">
              <div class="flex items-center justify-between">
                <div class="text-3xl">${decisao.emoji}</div>
                <span class="text-xs uppercase tracking-widest text-slate-500">${
                  decisao.custo > 0
                    ? `Custo: ${formatarNumero(decisao.custo)} ouro`
                    : "Sem custo imediato"
                }</span>
              </div>
              <h4 class="text-lg font-semibold text-slate-900">${decisao.titulo}</h4>
              <p class="text-sm text-slate-600">${decisao.descricao}</p>
              <button data-action="executar-decisao" data-decisao="${decisao.id}" class="decision-button" ${
                bloqueado ? "disabled" : ""
              }>
                <span>⚡</span>
                <span>${bloqueado ? "Ouro insuficiente" : "Executar decisão"}</span>
              </button>
            </div>
          `;
        }).join("");

        return `
          <section class="glass-card rounded-3xl p-6 space-y-4">
            <div class="flex items-center gap-3">
              <span class="emoji-icon">🗡️</span>
              <div>
                <h3 class="text-lg font-bold text-slate-900">Mesa de decisões rápidas</h3>
                <p class="text-sm text-slate-600">Gaste ouro, prestígio ou piedade para obter bônus imediatos.</p>
              </div>
            </div>
            <div class="grid gap-4 md:grid-cols-2">${cards}</div>
          </section>
        `;
      }

      function renderEventFeed() {
        const eventos = state.eventos.length
          ? state.eventos
              .map(
                (evt) => `
                  <div class="event-entry" data-type="${evt.tipo}">
                    <div class="text-xs text-slate-500">${evt.tempo}</div>
                    <div class="text-sm font-semibold">${evt.texto}</div>
                  </div>
                `
              )
              .join("")
          : '<p class="text-sm text-slate-600">Sem eventos recentes — conclua lições ou decisões para movimentar o reino.</p>';

        return `
          <section class="glass-card rounded-3xl p-6 space-y-4">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span class="emoji-icon">📜</span>
                <div>
                  <h3 class="text-lg font-bold text-slate-900">Relatórios da corte</h3>
                  <p class="text-sm text-slate-600">Registro vivo das suas decisões e resultados de módulos.</p>
                </div>
              </div>
              <button data-action="limpar-eventos" class="text-xs uppercase tracking-widest text-indigo-500 hover:text-indigo-700">
                Limpar
              </button>
            </div>
            <div class="space-y-3 max-h-80 overflow-auto pr-1">${eventos}</div>
          </section>
        `;
      }

      function renderDiagnostic() {
        const pergunta = QUIZ.diagnostico[state.diagnostico.i];
        return `
          <div class="min-h-screen bg-slate-50">
            ${renderHeader()}
            <main class="max-w-3xl mx-auto px-6 py-12">
              <div class="glass-card rounded-3xl p-8 shadow-xl space-y-6">
                <div class="flex flex-col gap-1">
                  <span class="text-sm font-semibold text-indigo-500 uppercase tracking-wide">Teste de Diagnóstico</span>
                  <h2 class="text-2xl font-bold text-slate-900">Questão ${state.diagnostico.i + 1} de ${QUIZ.diagnostico.length}</h2>
                </div>
                <p class="text-lg font-semibold text-slate-900">${pergunta.q}</p>
                <div class="grid gap-3 md:grid-cols-2">
                  ${pergunta.a
                    .map(
                      (alt, idx) => `
                        <button data-action="responder-diagnostico" data-index="${idx}" class="text-left px-4 py-3 rounded-2xl border border-slate-200 hover:bg-slate-100 transition">
                          ${alt}
                        </button>
                      `
                    )
                    .join("")}
                </div>
              </div>
            </main>
          </div>
        `;
      }

      function renderResultadoDiagnostico() {
        const pct = Math.round(
          (state.diagnostico.acertos / QUIZ.diagnostico.length) * 100
        );
        return `
          <div class="min-h-screen bg-slate-50">
            ${renderHeader()}
            <main class="max-w-3xl mx-auto px-6 py-12">
              <div class="glass-card rounded-3xl p-10 text-center space-y-6">
                <div class="text-6xl">🏆</div>
                <div class="text-5xl font-extrabold text-slate-900">${pct}%</div>
                <p class="text-lg text-slate-700">Nível inicial: <strong>${state.nivel}</strong></p>
                <div class="flex flex-wrap justify-center gap-3">
                  <button data-action="ver-modulos" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition">Explorar módulos</button>
                  <button data-action="abrir-preparacao" class="px-5 py-2.5 rounded-xl border border-slate-200 font-semibold hover:bg-slate-100 transition">Começar pela Preparação</button>
                </div>
              </div>
            </main>
          </div>
        `;
      }

      function renderGrade() {
        const cards = MODULOS.map((modulo, idx) => {
          const progresso = state.progresso[modulo.id];
          const bloqueado =
            idx > 0 && !state.progresso[MODULOS[idx - 1].id]?.feito;
          const estrelas = progresso ? progresso.estrelas : 0;
          const percent = Math.min(100, estrelas * 20);
          return `
            <div class="glass-card rounded-3xl p-6 space-y-4 ${
              bloqueado ? "opacity-60" : ""
            }">
              <div class="flex items-center gap-3">
                <div class="p-2 rounded-2xl bg-gradient-to-br ${
                  modulo.cor
                } text-white text-xl">${LESSONS[modulo.id].emoji}</div>
                <div class="flex-1">
                  <h3 class="text-lg font-bold text-slate-900">${modulo.nome}</h3>
                  <p class="text-xs text-slate-500">${LESSONS[modulo.id].titulo}</p>
                </div>
                <span class="text-xl">${progresso?.feito ? "✅" : "🔒"}</span>
              </div>
              <div class="w-full h-2 rounded-full bg-slate-200 overflow-hidden">
                <div class="h-full bg-indigo-500" style="width: ${percent}%;"></div>
              </div>
              <div class="flex items-center justify-between text-sm">
                <div class="flex items-center gap-2">
                  <span>⭐</span>
                  <span>${estrelas} / 5</span>
                </div>
                <button data-action="abrir-modulo" data-modulo="${modulo.id}" ${
                  bloqueado ? "disabled" : ""
                } class="px-3 py-1.5 rounded-xl text-white font-semibold ${
            bloqueado
              ? "bg-slate-300 cursor-not-allowed"
              : "bg-indigo-600 hover:bg-indigo-700"
          }">${progresso?.feito ? "Revisar" : "Começar"}</button>
              </div>
            </div>
          `;
        }).join("");

        const revisoes = state.revisao.length
          ? state.revisao
              .map(
                (id) => `
                  <button data-action="abrir-modulo" data-modulo="${id}" class="text-left p-4 rounded-2xl border border-slate-200 hover:bg-slate-100 transition">
                    <div class="font-semibold text-slate-900">${LESSONS[id].titulo}</div>
                    <div class="text-xs text-slate-500">Clique para reforçar os pontos fracos</div>
                  </button>
                `
              )
              .join("")
          : `<p class="text-slate-600">Você não possui revisões pendentes. Bom trabalho!</p>`;

        const checkpoints = CHECKPOINTS.map(
          (ck) => `
            <div class="p-4 rounded-2xl border border-slate-200">
              <div class="text-xs font-semibold text-indigo-500 uppercase tracking-wide">${ck.tempo}</div>
              <ul class="list-disc ml-5 text-sm text-slate-700 mt-2 space-y-1">
                ${ck.metas.map((meta) => `<li>${meta}</li>`).join("")}
              </ul>
            </div>
          `
        ).join("");

        return `
          <div class="min-h-screen bg-slate-50">
            ${renderHeader()}
            <main class="max-w-6xl mx-auto px-6 py-12 space-y-8">
              <section class="grid gap-6 md:grid-cols-3">
                ${cards}
              </section>
              <div class="grid gap-6 lg:grid-cols-[2fr_1fr]">
                <div class="space-y-6">
                  ${renderPainelReino()}
                  ${renderDecisionConsole()}
                  <section class="glass-card rounded-3xl p-6">
                    <div class="flex items-center gap-3 mb-4">
                      <span class="emoji-icon">🛡️</span>
                      <div>
                        <h3 class="text-lg font-bold text-slate-900">Revisão adaptativa</h3>
                        <p class="text-sm text-slate-600">Módulos abaixo de 80% retornam aqui para reforço.</p>
                      </div>
                    </div>
                    <div class="grid gap-3 md:grid-cols-2">${revisoes}</div>
                  </section>
                </div>
                <div class="space-y-6">
                  ${renderEventFeed()}
                  <section class="glass-card rounded-3xl p-6">
                    <div class="flex items-center gap-3 mb-4">
                      <span class="emoji-icon">🗂️</span>
                      <div>
                        <h3 class="text-lg font-bold text-slate-900">Checkpoints de mestre</h3>
                        <p class="text-sm text-slate-600">Metas para acompanhar a expansão dinástica.</p>
                      </div>
                    </div>
                    <div class="grid gap-4 md:grid-cols-1">${checkpoints}</div>
                  </section>
                </div>
              </div>
            </main>
          </div>
        `;
      }

      function renderLicao() {
        const modulo = state.moduloAtivo ? LESSONS[state.moduloAtivo] : null;
        if (!modulo) return "";
        const passoAtual = modulo.passos[state.passo];
        const podeAvancar = state.passo < modulo.passos.length - 1;
        const podeVoltar = state.passo > 0;
        const checklist = modulo.checklist
          .map((item) => `<span class="inline-flex items-center gap-2 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1 text-xs font-semibold">${item}</span>`)
          .join(" ");
        return `
          <div class="min-h-screen bg-slate-50">
            ${renderHeader()}
            <main class="max-w-5xl mx-auto px-6 py-10 space-y-6">
              <div class="flex items-center gap-3">
                <button data-action="ver-modulos" class="px-3 py-1.5 rounded-xl border border-slate-200 hover:bg-white transition">⬅️</button>
                <div class="p-2 rounded-2xl bg-gradient-to-br ${
                  MODULOS.find((m) => m.id === state.moduloAtivo).cor
                } text-white text-xl">${modulo.emoji}</div>
                <h2 class="text-2xl font-bold text-slate-900 flex-1">${modulo.titulo}</h2>
                <span class="inline-flex items-center gap-2 rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold">Dificuldade: ${state.dificuldade}</span>
              </div>
              <div class="glass-card rounded-3xl p-6 space-y-5">
                <div>
                  <div class="text-sm font-semibold text-indigo-500 uppercase tracking-wide mb-1">Passo ${state.passo + 1} de ${
          modulo.passos.length
        }</div>
                  <h3 class="text-xl font-bold text-slate-900">${passoAtual.titulo}</h3>
                  <ul class="list-disc ml-6 mt-3 space-y-2 text-slate-700">
                    ${passoAtual.acao.map((item) => `<li>${item}</li>`).join("")}
                  </ul>
                </div>
                ${
                  passoAtual.dica
                    ? `<div class="bg-indigo-50 border border-indigo-200 text-indigo-800 px-4 py-3 rounded-2xl text-sm">💡 ${passoAtual.dica}</div>`
                    : ""
                }
                <div class="flex flex-wrap gap-3 justify-between">
                  <button data-action="passo-anterior" class="px-4 py-2 rounded-xl border border-slate-200 ${
                    podeVoltar ? "hover:bg-slate-100" : "opacity-50 cursor-not-allowed"
                  }" ${podeVoltar ? "" : "disabled"}>⬅️ Anterior</button>
                  ${podeAvancar
                    ? `<button data-action="passo-proximo" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition">Próximo ➡️</button>`
                    : `<button data-action="ir-pratica" class="px-4 py-2 rounded-xl bg-emerald-600 text-white font-semibold hover:bg-emerald-700 transition">Pronto! Vamos praticar ⚔️</button>`}
                </div>
              </div>
              <div class="glass-card rounded-3xl p-6">
                <div class="flex items-center gap-3 mb-3">
                  <span class="emoji-icon">✅</span>
                  <h3 class="text-lg font-semibold text-slate-900">Checklist do módulo</h3>
                </div>
                <div class="flex flex-wrap gap-2">${checklist}</div>
              </div>
              ${renderSimulacoes()}
            </main>
          </div>
        `;
      }

      function renderSimulacoes() {
        const simulacoes = Object.values(ERROR_SIMULATIONS)
          .map(
            (sim) => `
              <div class="p-4 rounded-2xl border border-slate-200">
                <div class="font-semibold text-slate-900 mb-2">${sim.titulo}</div>
                <ol class="list-decimal ml-5 text-sm text-slate-700 space-y-1">
                  ${sim.passos.map((p) => `<li>${p}</li>`).join("")}
                </ol>
              </div>
            `
          )
          .join("");
        return `
          <div class="glass-card rounded-3xl p-6">
            <div class="flex items-center gap-3 mb-4">
              <span class="emoji-icon">⚠️</span>
              <div>
                <h3 class="text-lg font-semibold text-slate-900">Simulações de erro</h3>
                <p class="text-sm text-slate-600">Pratique o erro de forma segura e corrija em seguida.</p>
              </div>
            </div>
            <div class="grid gap-3 md:grid-cols-3">${simulacoes}</div>
          </div>
        `;
      }

      function renderPratica() {
        const banco = QUIZ[state.moduloAtivo] || [];
        const pergunta = banco[state.quiz.i];
        if (!pergunta) {
          return `
            <div class="min-h-screen bg-slate-50">
              ${renderHeader()}
              <main class="max-w-3xl mx-auto px-6 py-12">
                <div class="glass-card rounded-3xl p-8 text-center space-y-4">
                  <div class="text-5xl">🏆</div>
                  <p class="text-lg">Você concluiu as questões deste módulo.</p>
                  <button data-action="finalizar-modulo" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition">Finalizar módulo</button>
                </div>
              </main>
            </div>
          `;
        }
        const total = banco.length;
        return `
          <div class="min-h-screen bg-slate-50">
            ${renderHeader()}
            <main class="max-w-4xl mx-auto px-6 py-10 space-y-6">
              <div class="flex items-center gap-3">
                <button data-action="voltar-licao" class="px-3 py-1.5 rounded-xl border border-slate-200 hover:bg-white transition">⬅️</button>
                <div class="p-2 rounded-2xl bg-indigo-500 text-white text-xl">🎯</div>
                <h2 class="text-2xl font-bold text-slate-900 flex-1">Prática guiada</h2>
                <span class="inline-flex items-center gap-2 rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold">Dificuldade: ${state.dificuldade}</span>
              </div>
              <div class="glass-card rounded-3xl p-6 space-y-6">
                <h3 class="text-lg font-semibold text-slate-900">${pergunta.q}</h3>
                <div class="grid gap-3 md:grid-cols-2">
                  ${pergunta.a
                    .map((alt, idx) => {
                      const selecionada = state.quiz.selecionada === idx;
                      const estado = state.quiz.respondeu
                        ? idx === pergunta.c
                          ? "border-emerald-400 bg-emerald-50"
                          : selecionada
                          ? "border-rose-300 bg-rose-50"
                          : "opacity-70"
                        : "hover:bg-slate-100";
                      return `<button data-action="responder-quiz" data-index="${idx}" class="text-left px-4 py-3 rounded-2xl border border-slate-200 transition ${estado}" ${
                        state.quiz.respondeu ? "disabled" : ""
                      }>${alt}</button>`;
                    })
                    .join("")}
                </div>
                ${state.quiz.feedback
                  ? `<div class="rounded-2xl px-4 py-3 text-sm ${
                      state.quiz.feedback.correto
                        ? "bg-emerald-50 border border-emerald-200 text-emerald-800"
                        : "bg-amber-50 border border-amber-200 text-amber-800"
                    }">
                      <div class="font-semibold mb-1">${
                        state.quiz.feedback.correto ? "Perfeito!" : "Quase lá!"
                      }</div>
                      <p>${state.quiz.feedback.texto}</p>
                      <button data-action="proxima-questao" class="mt-3 px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition">Próximo</button>
                    </div>`
                  : ""}
              </div>
              <div class="glass-card rounded-3xl p-4 flex flex-wrap gap-3 text-sm text-slate-600">
                <span class="inline-flex items-center gap-2 rounded-full bg-slate-100 px-3 py-1">Questão ${
                  state.quiz.i + 1
                } / ${total}</span>
                <span class="inline-flex items-center gap-2 rounded-full bg-slate-100 px-3 py-1">Acertos: ${
                  state.quiz.acertos
                }</span>
              </div>
              ${renderSimulacoes()}
            </main>
          </div>
        `;
      }

      function renderModuloConcluido() {
        const progresso = state.progresso[state.moduloAtivo] || { estrelas: 0 };
        const estrelas = progresso.estrelas;
        const estrelasHtml = Array.from({ length: 5 })
          .map(
            (_, idx) =>
              `<span class="text-3xl ${idx < estrelas ? "text-yellow-400" : "text-slate-300"}">⭐</span>`
          )
          .join("");
        return `
          <div class="min-h-screen bg-slate-50">
            ${renderHeader()}
            <main class="max-w-3xl mx-auto px-6 py-12">
              <div class="glass-card rounded-3xl p-10 text-center space-y-6">
                <div class="text-6xl">🏆</div>
                <h3 class="text-2xl font-bold text-slate-900">Módulo concluído!</h3>
                <div class="flex items-center justify-center gap-2">${estrelasHtml}</div>
                <div class="flex flex-wrap justify-center gap-3">
                  <button data-action="ver-modulos" class="px-5 py-2.5 rounded-xl border border-slate-200 font-semibold hover:bg-slate-100 transition">Voltar aos módulos</button>
                  <button data-action="refazer-modulo" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition">Refazer para 5★</button>
                </div>
              </div>
            </main>
          </div>
        `;
      }

      function render() {
        let html = "";
        switch (state.tela) {
          case "boasvindas":
            html = renderBoasVindas();
            break;
          case "diagnostico":
            html = renderDiagnostic();
            break;
          case "resultado-diagnostico":
            html = renderResultadoDiagnostico();
            break;
          case "grade":
            html = renderGrade();
            break;
          case "licao":
            html = renderLicao();
            break;
          case "pratica":
            html = renderPratica();
            break;
          case "modulo-concluido":
            html = renderModuloConcluido();
            break;
          default:
            html = renderBoasVindas();
        }
        app.innerHTML = html;
        bindEvents();
      }

      function bindEvents() {
        document.querySelectorAll("[data-action]").forEach((el) => {
          el.addEventListener("click", (event) => {
            const action = event.currentTarget.dataset.action;
            const index = parseInt(event.currentTarget.dataset.index, 10);
            const modulo = event.currentTarget.dataset.modulo;
            const painel = event.currentTarget.dataset.painel;
            const decisao = event.currentTarget.dataset.decisao;
            switch (action) {
              case "iniciar-diagnostico":
                iniciarDiagnostico();
                break;
              case "ver-modulos":
                voltarGrade();
                break;
              case "responder-diagnostico":
                responderDiagnostico(index);
                break;
              case "abrir-preparacao":
                abrirModulo("preparacao");
                break;
              case "abrir-modulo":
                if (!event.currentTarget.disabled) abrirModulo(modulo);
                break;
              case "passo-proximo":
                avancarPasso();
                break;
              case "passo-anterior":
                voltarPasso();
                break;
              case "ir-pratica":
                irParaPratica();
                break;
              case "responder-quiz":
                responderQuiz(index);
                break;
              case "proxima-questao":
                proximaQuestao();
                break;
              case "finalizar-modulo":
                concluirModulo();
                break;
              case "voltar-licao":
                voltarLicoes();
                break;
              case "refazer-modulo":
                abrirModulo(state.moduloAtivo);
                break;
              case "mudar-painel":
                if (painel) mudarPainelReino(painel);
                break;
              case "executar-decisao":
                if (decisao) executarDecisao(decisao);
                break;
              case "limpar-eventos":
                limparEventos();
                break;
              default:
                break;
            }
          });
        });
      }

      render();
    </script>
  </body>
</html>
