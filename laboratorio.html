    const pickBrunoVoice = (voices = []) => {
      if (!voices.length) return null;
      const priority = voices.find(v => /br(?:-|\s)?pt|portuguese \(brazil\)/i.test(`${v.name} ${v.lang}`));
      return priority || voices.find(v => v.lang?.toLowerCase().startsWith('pt')) || voices[0];
    };

    const useBrunoVoice = () => {
      const [voice, setVoice] = useState(() => {
        if (typeof window === 'undefined' || !window.speechSynthesis) return null;
        const available = window.speechSynthesis.getVoices();
        const chosen = voiceRegistry.voice || pickBrunoVoice(available);
        if (chosen) voiceRegistry.voice = chosen;
        return chosen || null;
      });

      useEffect(() => {
        if (typeof window === 'undefined' || !window.speechSynthesis) return;
        const handleVoices = () => {
          const available = window.speechSynthesis.getVoices();
          if (!available.length) return;
          const chosen = pickBrunoVoice(available);
          if (chosen && chosen !== voiceRegistry.voice) {
            voiceRegistry.voice = chosen;
            setVoice(chosen);
          }
        };
        handleVoices();
        window.speechSynthesis.addEventListener('voiceschanged', handleVoices);
        return () => window.speechSynthesis.removeEventListener('voiceschanged', handleVoices);
      }, []);

      return voice;
    };

    const useSound = (key) => {
      const ref = useRef(null);
      useEffect(() => {
        const audio = new Audio(audioBank[key]);
        audio.preload = "auto";
        audio.volume = 0.45;
        ref.current = audio;
        return () => {
          audio.pause();
          audio.src = "";
        };
      }, [key]);
      return useCallback(() => {
        if (!ref.current) return;
        try {
          ref.current.currentTime = 0;
          const promise = ref.current.play();
          if (promise?.catch) promise.catch(() => {});
        } catch (error) {
          console.warn('Falha ao reproduzir som', error);
        }
      }, []);
    };

    function ReadAloudButton({ text }) {
      const clickSound = useSound('click');
      const profile = useContext(BrunoProfileContext);
      const voice = useBrunoVoice();
      const canSpeak = typeof window !== "undefined" && "speechSynthesis" in window;

      const speak = useCallback(() => {
        if (!canSpeak) return;
        const sanitized = String(text || "").replace(/[\s\n]+/g, " ");
        const utterance = new SpeechSynthesisUtterance(sanitized);
        utterance.lang = "pt-BR";
        if (voice) utterance.voice = voice;
        if (profile?.speech) {
          utterance.rate = profile.speech.rate;
          utterance.pitch = profile.speech.pitch;
        }
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      }, [canSpeak, text, voice, profile]);

        <button
          onClick={() => { clickSound(); speak(); }}
          className="inline-flex items-center gap-2 text-sm px-3 py-1 rounded-lg bg-purple-100 text-purple-800 hover:bg-purple-200"

    const MarkdownRenderer = React.memo(function MarkdownRenderer({ text }) {
      const contentRef = useRef(null);

      const blocks = useMemo(() => {
        if (!text) return [];
        return text.split(/\n+/)
          .map(line => line.trim())
          .filter(Boolean)
          .map(line => {
            if (line === '---') return { type: 'divider' };
            if (line.startsWith('## ')) return { type: 'h2', value: line.substring(3) };
            if (line.startsWith('### ')) return { type: 'h3', value: line.substring(4) };
            const parts = line
              .split(/(\*\*.*?\*\*|\$.*?\$|\$\$.*?\$\$)/g)
              .filter(Boolean)
              .map(segment => {
                if (segment.startsWith('**') && segment.endsWith('**')) return { type: 'strong', value: segment.slice(2, -2) };
                if (segment.startsWith('$')) return { type: 'math', value: segment };
                return { type: 'text', value: segment };
              });
            return { type: 'paragraph', parts };
          });
      }, [text]);

      useEffect(() => {
        if (contentRef.current && window.renderMathInElement) {
          window.renderMathInElement(contentRef.current, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false },
            ],
          });
        }
      }, [blocks]);

      if (!text) return null;

      return (
        <div ref={contentRef}>
          {blocks.map((block, index) => {
            if (block.type === 'divider') return <hr key={index} className="my-4 border-purple-200" />;
            if (block.type === 'h2') return <h2 key={index} className="text-xl font-bold mt-4 mb-2">{block.value}</h2>;
            if (block.type === 'h3') return <h3 key={index} className="text-lg font-bold mt-3 mb-1">{block.value}</h3>;
            return (
              <p key={index} className="my-2">
                {block.parts.map((part, i) => {
                  if (part.type === 'strong') return <strong key={i}>{part.value}</strong>;
                  if (part.type === 'math') return <span key={i}>{part.value}</span>;
                  return <span key={i}>{part.value}</span>;
                })}
              </p>
            );
          })}
        </div>
      );
    });

              >
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16"><path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576zm6.787-8.201L1.591 6.602l4.339 2.76z"/></svg>
              </button>
            </div>
          </footer>
        </div>
      );
    });

    function App() {
      const clickSound = useSound('click');
      const successSound = useSound('ok');
      const errorSound = useSound('err');

      const [currentScreen, setCurrentScreen] = useState("name-entry");
      const [studentName, setStudentName] = useState("");
      const [studentAge, setStudentAge] = useState("");
      const [userLevel, setUserLevel] = useState(null);
      const [currentModule, setCurrentModule] = useState(null);
      const [currentQuestion, setCurrentQuestion] = useState(0);
      const [processedQ, setProcessedQ] = useState(null);
      const [score, setScore] = useState(0);
      const [consecutiveCorrect, setConsecutiveCorrect] = useState(0);
      const [consecutiveWrong, setConsecutiveWrong] = useState(0);
      const [difficulty, setDifficulty] = useState("medium");
      const [feedback, setFeedback] = useState(null);
      const [completedPlanets, setCompletedPlanets] = useState([]);
      const [totalStars, setTotalStars] = useState(0);
      const [diagnosticAnswers, setDiagnosticAnswers] = useState([]);
      const [answeredInModule, setAnsweredInModule] = useState(0);
      const [remedialQueue, setRemedialQueue] = useState([]);
      const [skillMastery, setSkillMastery] = useState(() => (
        Object.fromEntries(Object.keys(FRACTION_SKILLS).map(k => [k, { recentCorrect: 0, totalCorrect: 0 }]))
      ));
      const [isGeminiLoading, setIsGeminiLoading] = useState(false);
      const [geminiContent, setGeminiContent] = useState(null);
      const [geminiHint, setGeminiHint] = useState(null);
      const [isHintLoading, setIsHintLoading] = useState(false);
      const [isMentorLoading, setIsMentorLoading] = useState(false);
      const [mentorMessage, setMentorMessage] = useState(`Olá! Eu sou Bruno, seu mentor nesta jornada. Estou animado para explorar o universo dos números com você!`);
      const [currentStep, setCurrentStep] = useState(0);
      const [chatHistory, setChatHistory] = useState([]);
      const [isChatLoading, setIsChatLoading] = useState(false);
      const [aiGeneratedQuestion, setAIGeneratedQuestion] = useState(null);
      const [intelligentAgenda, setIntelligentAgenda] = useState([]);
      const abortControllers = useRef(new Set());

      const profile = useMemo(() => AGE_PROFILES[studentAge] || AGE_PROFILES.default, [studentAge]);

      useEffect(() => () => {
        abortControllers.current.forEach(ctrl => ctrl.abort());
        abortControllers.current.clear();
      }, []);

      const trackAgenda = useCallback((entry) => {
        setIntelligentAgenda(prev => [entry, ...prev].slice(0, 5));
      }, []);

      const buildContext = useCallback(() => {
        if (!processedQ) return 'Sem questão em foco.';
        const concept = processedQ.skill ? FRACTION_SKILLS[processedQ.skill]?.label || processedQ.skill : currentModule;
        return `Questão atual: ${processedQ.question}\nAlternativas: ${processedQ.options.join(', ')}\nHabilidade trabalhada: ${concept}.`;
      }, [processedQ, currentModule]);

      const callGeminiAPIWithRetries = useCallback(async (payload, retries = 3, delay = 1000) => {
        const apiKey = window.GOOGLE_GEMINI_API_KEY || "AIzaSyCt83YFHZQytF1oKfndYZAI9brdyvi9EAs";
        const model = profile?.preferredModel || 'gemini-1.5-flash';
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
        let lastError = null;
        const controller = new AbortController();
        abortControllers.current.add(controller);
        try {
          for (let attempt = 0; attempt < retries; attempt++) {
            try {
              const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                signal: controller.signal,
              });
              if (!response.ok) throw new Error(`API request failed with status ${response.status}`);
              const result = await response.json();
              const candidate = result.candidates?.[0];
              const text = candidate?.content?.parts?.map(part => part.text).join('\n');
              if (text) return text;
              throw new Error('Resposta da IA sem conteúdo utilizável.');
            } catch (error) {
              lastError = error;
              if (controller.signal.aborted) throw new Error('Requisição cancelada');
              if (attempt === retries - 1) throw error;
              await new Promise(res => setTimeout(res, delay * Math.pow(2, attempt)));
            }
          }
        } finally {
          abortControllers.current.delete(controller);
        }
        throw lastError || new Error('Erro desconhecido ao chamar a IA.');
      }, [profile]);

      const startClick = useCallback(() => {
        clickSound();
      }, [clickSound]);

      const handleGetExplanation = useCallback(async () => {
        if (!processedQ) return;
        setIsGeminiLoading(true);
        setGeminiContent(null);
        const systemPrompt = `Você é Bruno, um professor de matemática amigável, paciente e criativo. O aluno se chama ${studentName || 'Explorador'} e tem ${studentAge || 'idade indefinida'} anos. Use um tom ${profile.tone}. ${profile.encouragementCue}`;
        const userQuery = `Reexplique de uma forma diferente porque a resposta correta da pergunta "${processedQ.question}" é "${processedQ.options[processedQ.correct]}". Inclua um erro comum para evitar, uma dica prática e finalize convidando o aluno a compartilhar a ideia com alguém. Contexto desejado: ${profile.storyHook}`;
        const payload = { contents: [{ role: "user", parts: [{ text: userQuery }] }], systemInstruction: { parts: [{ text: systemPrompt }] } };
        try {
          const explanation = await callGeminiAPIWithRetries(payload);
          setGeminiContent({ type: 'explanation', text: explanation });
          trackAgenda({ type: 'explicacao', message: 'Bruno gerou uma nova explicação.' });
        } catch (error) {
          setGeminiContent({ type: 'error', text: `Não consegui obter uma nova explicação agora. Detalhes: ${error.message}` });
        } finally {
          setIsGeminiLoading(false);
        }
      }, [processedQ, studentName, studentAge, profile, callGeminiAPIWithRetries, trackAgenda]);

      const handleGetSimilarProblem = useCallback(async (isDynamic = false) => {
        setIsGeminiLoading(true);
        const systemPrompt = `Você é Bruno, um criador de desafios matemáticos para ${studentName || 'o aluno'} (${studentAge || 'idade indefinida'} anos). Use um tom ${profile.tone}, traga curiosidade e varie o tipo de pergunta para manter o interesse.`;
        const context = isDynamic
          ? `Contexto adaptativo: módulo ${currentModule}, dificuldade ${difficulty}.` + (processedQ?.skill ? ` Habilidade: ${FRACTION_SKILLS[processedQ.skill]?.label || processedQ.skill}.` : '')
          : buildContext();
        const userQuery = `Gere um exercício inédito com base no contexto a seguir:\n${context}\nExija uma justificativa breve na explicação correta e utilize elementos conforme este direcionamento: ${profile.storyHook}`;
        const schema = {
          type: "OBJECT",
          properties: {
            question: { type: "STRING" },
            options: { type: "ARRAY", items: { type: "STRING" }, minItems: 4, maxItems: 4 },
            correct: { type: "INTEGER" },
            rationale: { type: "STRING" }
          },
          required: ["question", "options", "correct"]
        };
        const payload = {
          contents: [{ role: "user", parts: [{ text: userQuery }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: { responseMimeType: "application/json", responseSchema: schema }
        };
        try {
          const resultText = await callGeminiAPIWithRetries(payload);
          const newQ = JSON.parse(resultText);
          if (!Array.isArray(newQ.options) || newQ.options.length !== 4 || typeof newQ.correct !== 'number') {
            throw new Error('Estrutura inválida recebida da IA.');
          }
          const geminiQuestion = { ...newQ, skill: processedQ?.skill || 'gemini-practice', visual: '✨ Desafio Inteligente do Bruno!' };
          setRemedialQueue(prev => [geminiQuestion, ...prev]);
          setGeminiContent(null);
          setGeminiHint(null);
          setAIGeneratedQuestion(geminiQuestion);
          trackAgenda({ type: 'questao', message: 'Nova questão contextual criada pela IA.' });
        } catch (error) {
          setGeminiContent({ type: 'error', text: `Não consegui criar uma nova questão agora. Detalhes: ${error.message}` });
        } finally {
          setIsGeminiLoading(false);
        }
      }, [studentName, studentAge, currentModule, difficulty, processedQ, profile, callGeminiAPIWithRetries, buildContext, trackAgenda]);

      const handleGetHint = useCallback(async () => {
        if (!processedQ) return;
        setIsHintLoading(true);
        setGeminiHint(null);
        const systemPrompt = `Você é Bruno, um tutor de matemática. Fale com ${studentName || 'o aluno'} (${studentAge || 'idade indefinida'} anos) em um tom ${profile.tone}. ${profile.encouragementCue}`;
        const userQuery = `Pergunta: ${processedQ.question}. Opções: ${processedQ.options.join(', ')}. Escreva UMA dica curiosa que aponte o próximo passo sem entregar a resposta.`;
        const payload = { contents: [{ role: "user", parts: [{ text: userQuery }] }], systemInstruction: { parts: [{ text: systemPrompt }] } };
        try {
          const hint = await callGeminiAPIWithRetries(payload);
          setGeminiHint(hint);
        } catch (error) {
          setGeminiHint(`Não consegui gerar uma dica agora (${error.message}). Tente novamente!`);
        } finally {
          setIsHintLoading(false);
        }
      }, [processedQ, studentName, studentAge, profile, callGeminiAPIWithRetries]);

      const handleGetMentorFeedback = useCallback(async () => {
        setIsMentorLoading(true);
        let progressSummary = `Planetas completados: ${completedPlanets.length} de ${planets.length}. Estrelas totais: ${totalStars}.`;
        if (completedPlanets.includes('fracoes')) {
          const strongSkills = Object.entries(skillMastery)
            .filter(([id, s]) => s.recentCorrect >= FRACTION_SKILLS[id].goal)
            .map(([id]) => FRACTION_SKILLS[id].label);
          const weakSkills = Object.entries(skillMastery)
            .filter(([id, s]) => s.recentCorrect < FRACTION_SKILLS[id].goal && s.totalCorrect > 0)
            .map(([id]) => FRACTION_SKILLS[id].label);
          if (strongSkills.length > 0) progressSummary += ` Destaques: ${strongSkills.join(', ')}.`;
          if (weakSkills.length > 0) progressSummary += ` Focos sugeridos: ${weakSkills.join(', ')}.`;
        }
        const systemPrompt = `Você é Bruno Mayson, um mentor de matemática gentil e encorajador. Use um tom ${profile.tone} e siga esta orientação: ${profile.mentorCue} Resuma em até duas frases.`;
        const userQuery = `Aluno: ${studentName || 'Explorador'} (${studentAge || 'idade indefinida'}). Progresso: ${progressSummary}`;
        const payload = { contents: [{ role: "user", parts: [{ text: userQuery }] }], systemInstruction: { parts: [{ text: systemPrompt }] } };
        try {
          const message = await callGeminiAPIWithRetries(payload);
          setMentorMessage(message);
        } catch (error) {
          setMentorMessage(`Continue firme! (Falha ao atualizar mensagem: ${error.message})`);
        } finally {
          setIsMentorLoading(false);
        }
      }, [completedPlanets, totalStars, skillMastery, studentName, studentAge, profile, callGeminiAPIWithRetries]);

      const handleSendChatMessage = useCallback(async (message) => {
        if (isChatLoading) return;
        const trimmed = (message || '').trim();
        if (!trimmed) return;
        const userMessage = { role: "user", parts: [{ text: trimmed }] };
        const updatedHistory = [...chatHistory, userMessage];
        setChatHistory(updatedHistory);
        setIsChatLoading(true);

        const systemPrompt = `Você é Bruno Mayson, tutor especialista em matemática e finanças para crianças. O aluno se chama ${studentName || 'Explorador'} e tem ${studentAge || 'idade indefinida'} anos. Use um tom ${profile.tone}. ${profile.chatGuidance}`;
        const payload = {
          contents: updatedHistory,
          systemInstruction: { parts: [{ text: systemPrompt }] },
        };

        try {
          const response = await callGeminiAPIWithRetries(payload);
          setChatHistory(prev => [...prev, { role: "model", parts: [{ text: response }] }]);
          if (/tente responder|qual seria|poderia me dizer/i.test(response)) {
            trackAgenda({ type: 'pergunta', message: 'Bruno lançou um desafio na conversa.' });
          }
        } catch (error) {
          setChatHistory(prev => [...prev, { role: "model", parts: [{ text: `Ops! Não consegui responder agora (${error.message}). Tente novamente.` }] }]);
        } finally {
          setIsChatLoading(false);
        }
      }, [isChatLoading, chatHistory, studentName, studentAge, profile, callGeminiAPIWithRetries, trackAgenda]);

      useEffect(() => {
        if (currentScreen === 'planets' && studentName) handleGetMentorFeedback();
      }, [currentScreen, studentName, handleGetMentorFeedback]);

      const currentQ = useMemo(() => {
        const questions = moduleQuestions[currentModule]?.[difficulty] || [];
        if (remedialQueue.length > 0) return remedialQueue[0];
        if (currentQuestion < questions.length) return questions[currentQuestion];
        return null;
      }, [currentModule, difficulty, currentQuestion, remedialQueue]);

      useEffect(() => {
        if (!currentQ) { setProcessedQ(null); return; }
        const correctValue = currentQ.options[currentQ.correct];
        const shuffledOptions = [...currentQ.options].sort(() => Math.random() - 0.5);
        const newCorrectIndex = shuffledOptions.indexOf(correctValue);
        let newAlsoCorrectIndexes = [];
        if (currentQ.alsoCorrect) {
          const alsoCorrectValues = currentQ.alsoCorrect.map(i => currentQ.options[i]);
          newAlsoCorrectIndexes = alsoCorrectValues.map(v => shuffledOptions.indexOf(v));
        }
        setProcessedQ({ ...currentQ, options: shuffledOptions, correct: newCorrectIndex, alsoCorrect: newAlsoCorrectIndexes });
      }, [currentQ]);

      const handleNameSubmit = useCallback((value) => {
        const trimmed = (value || '').trim();
        if (!trimmed) return;
        startClick();
        setStudentName(trimmed);
        setCurrentScreen('age-gate');
      }, [startClick]);

      const handleAgeSubmit = useCallback((ageRange) => {
        setStudentAge(ageRange);
        setCurrentScreen('welcome');
      }, []);

      const handleDiagnosticAnswer = useCallback((idx) => {
        const cur = diagnosticQuestions[currentQuestion];
        const updatedAnswers = [...diagnosticAnswers, { question: currentQuestion, correct: idx === cur.correct }];
        setDiagnosticAnswers(updatedAnswers);
        if (currentQuestion < diagnosticQuestions.length - 1) {
          setCurrentQuestion(q => q + 1);
          return;
        }
        const correctCount = updatedAnswers.filter(a => a.correct).length;
        const pct = (correctCount / diagnosticQuestions.length) * 100;
        setUserLevel(pct >= 80 ? 'advanced' : pct >= 60 ? 'intermediate' : 'beginner');
        setCurrentScreen('diagnostic-result');
      }, [currentQuestion, diagnosticAnswers]);

      const startModule = useCallback((planetId) => {
        startClick();
        if (planetId === 'chat') {
          setCurrentScreen('chat');
          return;
        }
        setCurrentModule(planetId);
        setCurrentQuestion(0);
        setScore(0);
        setConsecutiveCorrect(0);
        setConsecutiveWrong(0);
        setFeedback(null);
        setAnsweredInModule(0);
        setRemedialQueue([]);
        setGeminiHint(null);
        setCurrentStep(0);
        setAIGeneratedQuestion(null);
        setIntelligentAgenda([]);
        setDifficulty(userLevel === 'advanced' ? 'hard' : userLevel === 'intermediate' ? 'medium' : 'easy');
        if (planetId === 'fracoes') {
          setSkillMastery(Object.fromEntries(Object.keys(FRACTION_SKILLS).map(k => [k, { recentCorrect: 0, totalCorrect: 0 }])));
        }
        setCurrentScreen('lesson');
      }, [startClick, userLevel]);

      const bumpDifficultyIfNeeded = useCallback((count, dir) => {
        if (dir === 'up' && count >= 3 && difficulty !== 'hard') {
          setDifficulty(prev => (prev === 'easy' ? 'medium' : 'hard'));
          setConsecutiveCorrect(0);
        }
        if (dir === 'down' && count >= 2 && difficulty !== 'easy') {
          setDifficulty(prev => (prev === 'hard' ? 'medium' : 'easy'));
          setConsecutiveWrong(0);
        }
      }, [difficulty]);

      const pickRemedialSkillId = useCallback(() => {
        let pending = Object.entries(skillMastery)
          .filter(([, s]) => s.recentCorrect === 0 && s.totalCorrect > 0)
          .map(([id]) => id);
        if (pending.length === 0) {
          pending = Object.entries(skillMastery)
            .filter(([id, s]) => s.recentCorrect < FRACTION_SKILLS[id].goal)
            .map(([id]) => id);
        }
        if (!pending.length) return null;
        return pending[Math.floor(Math.random() * pending.length)];
      }, [skillMastery]);

      const enqueueRemedial = useCallback(() => {
        if (currentModule !== 'fracoes') return;
        const need = pickRemedialSkillId();
        if (!need) return;
        const pools = [difficulty, 'easy', 'medium', 'hard'];
        for (const d of pools) {
          const pool = (moduleQuestions.fracoes[d] || []).filter(q => q.skill === need);
          if (pool.length) {
            const q = pool[Math.floor(Math.random() * pool.length)];
            setRemedialQueue(prev => [...prev, q]);
            break;
          }
        }
      }, [currentModule, pickRemedialSkillId, difficulty]);

      const handleAnswer = useCallback((idx) => {
        if (!processedQ) return;
        const corrects = new Set([processedQ.correct, ...(processedQ.alsoCorrect || [])]);
        const isCorrect = corrects.has(idx);
        setAnsweredInModule(v => v + 1);

        if (currentModule === 'fracoes' && processedQ.skill && processedQ.skill !== 'gemini-practice') {
          setSkillMastery(prev => {
            const updated = { ...prev };
            if (isCorrect) {
              const current = updated[processedQ.skill] || { recentCorrect: 0, totalCorrect: 0 };
              updated[processedQ.skill] = {
                recentCorrect: Math.min(current.recentCorrect + 1, FRACTION_SKILLS[processedQ.skill].goal),
                totalCorrect: current.totalCorrect + 1
              };
            } else {
              const current = updated[processedQ.skill] || { recentCorrect: 0, totalCorrect: 0 };
              updated[processedQ.skill] = { ...current, recentCorrect: 0 };
            }
            return updated;
          });
        }

        if (isCorrect) {
          successSound();
          setScore(v => v + 1);
          setConsecutiveCorrect(prev => {
            const next = prev + 1;
            bumpDifficultyIfNeeded(next, 'up');
            return next >= 3 ? 0 : next;
          });
          setConsecutiveWrong(0);
          setFeedback({ type: 'success', message: '🌟 Incrível! Você acertou!', explanation: processedQ.explanation });
          if (!remedialQueue.length && processedQ.skill) {
            trackAgenda({ type: 'sucesso', message: `Habilidade reforçada: ${processedQ.skill}` });
          }
        } else {
          errorSound();
          setConsecutiveWrong(prev => {
            const next = prev + 1;
            bumpDifficultyIfNeeded(next, 'down');
            return next >= 2 ? 0 : next;
          });
          setConsecutiveCorrect(0);
          const why = processedQ.whyWrong?.[idx] || "Vamos revisar com um desenho.";
          const hint = processedQ.skill === 'compare' ? "Dica: tente transformar em décimos ou usar barras."
            : processedQ.skill === 'simplify' ? "Dica: procure um número que divida em cima e embaixo."
            : "Dica: numerador = partes pintadas; denominador = partes totais.";
          setFeedback({
            type: 'error',
            message: '🤔 Ainda não está certo — e tudo bem!',
            explanation: `${why} ${hint}`,
            encouragement: 'Você pensou com coragem. Vamos tentar de outro jeito!'
          });
          trackAgenda({ type: 'reforco', message: 'Planejando nova tentativa personalizada.' });
          if (!remedialQueue.length) handleGetSimilarProblem(true);
        }

        if (remedialQueue.length > 0) {
          setRemedialQueue(q => q.slice(1));
        }
      }, [processedQ, currentModule, remedialQueue, successSound, errorSound, bumpDifficultyIfNeeded, handleGetSimilarProblem, trackAgenda]);

      const nextQuestion = useCallback(() => {
        startClick();
        setFeedback(null);
        setGeminiContent(null);
        setGeminiHint(null);
        const questions = moduleQuestions[currentModule]?.[difficulty] || [];
        if (remedialQueue.length <= 1) {
          if (currentQuestion >= questions.length - 1) {
            handleGetSimilarProblem(true);
            return;
          }
          if (currentModule === 'fracoes' && answeredInModule > 0 && answeredInModule % 3 === 0) enqueueRemedial();
          setCurrentQuestion(q => q + 1);
        }
      }, [startClick, remedialQueue.length, currentModule, difficulty, currentQuestion, answeredInModule, enqueueRemedial, handleGetSimilarProblem]);

      const startExercises = useCallback(() => {
        startClick();
        setCurrentScreen('learning');
      }, [startClick]);

      const finishModule = useCallback(() => {
        if (currentModule === 'fracoes') {
          const unmetGoals = Object.entries(skillMastery)
            .filter(([id, skillData]) => skillData.recentCorrect < FRACTION_SKILLS[id].goal);
          if (unmetGoals.length > 0) {
            enqueueRemedial();
            setCurrentQuestion(0);
            setCurrentScreen('learning');
            return;
          }
        }
        const answered = Math.max(answeredInModule, 1);
        const finalScore = (score / answered) * 10;
        const stars = Math.round(finalScore / 2);
        setTotalStars(v => v + stars);
        if (finalScore >= 8 && !completedPlanets.includes(currentModule)) {
          setCompletedPlanets(v => [...v, currentModule]);
        }
        if (finalScore >= 8) fireConfetti();
        setCurrentScreen('module-complete');
      }, [currentModule, skillMastery, enqueueRemedial, answeredInModule, score, completedPlanets]);

      const AgeGateScreen = () => (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="max-w-xl w-full mx-auto text-center pop">
            <div className="mb-8 float text-6xl">🎂</div>
            <h1 className="text-5xl font-bold text-white mb-6">Olá, {studentName}! Qual a sua faixa etária?</h1>
            <p className="text-white/80 mb-8 text-lg">Isso ajuda o Bruno a personalizar sua jornada!</p>
            <div className="grid grid-cols-1 gap-4">
              <button onClick={() => handleAgeSubmit('6-8')} className="bg-green-400 hover:bg-green-500 text-white font-bold text-2xl px-12 py-6 rounded-2xl shadow-2xl transform hover:scale-105 transition-all">6 a 8 anos</button>
              <button onClick={() => handleAgeSubmit('9-12')} className="bg-blue-400 hover:bg-blue-500 text-white font-bold text-2xl px-12 py-6 rounded-2xl shadow-2xl transform hover:scale-105 transition-all">9 a 12 anos</button>
              <button onClick={() => handleAgeSubmit('13+')} className="bg-purple-400 hover:bg-purple-500 text-white font-bold text-2xl px-12 py-6 rounded-2xl shadow-2xl transform hover:scale-105 transition-all">13+ anos</button>
            </div>
          </div>
        </div>
      );

      const WelcomeScreen = () => (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="max-w-2xl mx-auto text-center pop">
            <div className="mb-8 float text-6xl">✨</div>
            <h1 className="text-6xl font-bold text-white mb-6 pulse">Laboratório dos Números</h1>
            <div className="bg-white/10 backdrop-blur-lg rounded-3xl p-8 mb-8 border-2 border-white/20">
              <p className="text-2xl text-white mb-4">Bem-vindo(a), <span className="font-bold text-yellow-300">{studentName}</span>!</p>
              <p className="text-xl text-white/90 mb-2">Aqui, cada desafio é um degrau da sabedoria matemática.</p>
              <p className="text-lg text-white/80">Vamos começar nossa missão? 🚀</p>
            </div>
            <button onClick={() => { startClick(); setCurrentScreen('diagnostic'); setCurrentQuestion(0); setDiagnosticAnswers([]); }}
              className="bg-yellow-400 hover:bg-yellow-500 text-purple-900 font-bold text-2xl px-12 py-6 rounded-2xl shadow-2xl transform hover:scale-105 transition-all">
              Iniciar Diagnóstico ✨
            </button>
          </div>
        </div>
      );

      const DiagnosticScreen = () => {
        const currentDiagQ = diagnosticQuestions[currentQuestion];
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-purple-50 p-6 flex items-center justify-center">
            <div className="max-w-3xl w-full mx-auto">
              <div className="bg-white rounded-3xl shadow-2xl p-8 mb-6 pop">
                <div className="flex items-center justify-between mb-6">
                  <h2 className="text-3xl font-bold text-gray-800">Teste de Diagnóstico</h2>
                  <span className="text-lg text-gray-600">Questão {currentQuestion + 1} de {diagnosticQuestions.length}</span>
                </div>
                <div className="bg-purple-50 p-6 rounded-2xl mb-6">
                  <p className="text-2xl text-gray-800 mb-6">{currentDiagQ.question}</p>
                  <div className="grid grid-cols-2 gap-4">
                    {currentDiagQ.options.map((opt, idx) => (
                      <button key={idx} onClick={() => { clickSound(); handleDiagnosticAnswer(idx); }}
                        className="bg-white hover:bg-purple-100 border-2 border-purple-200 p-4 rounded-xl text-lg font-medium transition-all hover:scale-105">
                        {opt}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const DiagnosticResultScreen = () => {
        const correctCount = diagnosticAnswers.filter(a => a.correct).length;
        const percentage = (correctCount / diagnosticQuestions.length) * 100;
        return (
          <div className="min-h-screen bg-gradient-to-br from-green-50 to-blue-50 p-6 flex items-center justify-center">
            <div className="max-w-4xl mx-auto">
              <div className="bg-white rounded-3xl shadow-2xl p-8 text-center pop">
                <div className="text-6xl mb-6">🏆</div>
                <h2 className="text-4xl font-bold text-gray-800 mb-4">Diagnóstico Completo!</h2>
                <div className="bg-gradient-to-r from-purple-100 to-pink-100 p-6 rounded-2xl mb-6">
                  <p className="text-6xl font-bold text-purple-600 mb-2">{percentage.toFixed(0)}%</p>
                  <p className="text-xl text-gray-700">Você acertou {correctCount} de {diagnosticQuestions.length} questões</p>
                </div>
                <button onClick={() => { startClick(); setCurrentScreen('planets'); }}
                  className="bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold text-xl px-10 py-4 rounded-xl shadow-lg hover:scale-105 transition-all">
                  Explorar os Planetas Matemáticos 🚀
                </button>
              </div>
            </div>
          </div>
        );
      };

      const PlanetsScreen = () => (
        <div className="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 p-6">
          <div className="max-w-6xl mx-auto">
            <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-6 mb-6 border border-white/20 pop">
              <div className="flex items-center justify-between">
                <div>
                  <h2 className="text-3xl font-bold text-white mb-2">Meu Progresso, {studentName}</h2>
                  <p className="text-white/80">Continue explorando os planetas matemáticos!</p>
                </div>
                <div className="text-right">
                  <div className="flex items-center gap-2 mb-2">
                    <span className="text-yellow-300 text-2xl">⭐</span>
                    <span className="text-3xl font-bold text-yellow-300">{totalStars}</span>
                  </div>
                  <p className="text-white/80 text-sm">Estrelas conquistadas</p>
                </div>
              </div>
              <div className="mt-4 bg-white/20 rounded-full h-3">
                <div className="bg-yellow-400 h-full rounded-full transition-all" style={{ width: `${(completedPlanets.length / planets.length) * 100}%` }}></div>
              </div>
              {(completedPlanets.includes('fracoes') || totalStars > 0) && (
                <div className="mt-4 bg-white/10 rounded-xl p-4">
                  <p className="text-white/90 mb-2 text-sm">Domínio de Frações</p>
                  <MasteryChart mastery={skillMastery} />
                </div>
              )}
            </div>

            <div className="bg-gradient-to-r from-pink-500/20 to-purple-500/20 backdrop-blur-lg rounded-2xl p-6 mb-6 border border-white/20 pop">
              <p className="text-xl text-white italic">
                💬 "{isMentorLoading ? 'Bruno está digitando...' : mentorMessage}"
                <span className="block mt-2 text-right text-sm">— Bruno Mayson, seu mentor</span>
              </p>
            </div>

            {intelligentAgenda.length > 0 && (
              <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-6 mb-6 border border-white/20 pop">
                <h3 className="text-white text-xl font-semibold mb-2">Central de Insights do Bruno</h3>
                <ul className="space-y-2">
                  {intelligentAgenda.map((entry, index) => (
                    <li key={index} className="bg-white/10 text-white text-sm px-4 py-2 rounded-xl flex items-center gap-2">
                      <span className="text-lg">🧠</span>
                      <span>{entry.message}</span>
                    </li>
                  ))}
                </ul>
              </div>
            )}

            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
              {planets.map((p, index) => {
                const isCompleted = completedPlanets.includes(p.id);
                const prevPlanet = planets[index - 1];
                const isLocked = p.id !== 'chat' && prevPlanet && !completedPlanets.includes(prevPlanet.id);
                return (
                  <div key={p.id} className={`bg-white/10 backdrop-blur-lg rounded-3xl p-8 border-2 ${isCompleted ? 'border-yellow-400' : 'border-white/20'} ${isLocked ? 'opacity-50' : 'hover:scale-105'} transition-all pop`}>
                    <div className="text-center">
                      <div className="text-7xl mb-4">{p.emoji}</div>
                      <h3 className="text-2xl font-bold text-white mb-2">{p.name}</h3>
                      {isCompleted && (
                        <div className="flex items-center justify-center gap-2 mb-4 text-yellow-300">
                          <span>✅</span><span className="font-semibold">Planeta Conquistado!</span>
                        </div>
                      )}
                      {isLocked ? (
                        <p className="text-white/60 mb-4">🔒 Complete o planeta anterior</p>
                      ) : (
                        <button onClick={() => startModule(p.id)}
                          className={`bg-gradient-to-r ${p.color} text-white font-bold px-8 py-3 rounded-xl shadow-lg hover:scale-105 transition-all mt-4`}>
                          {p.id === 'chat' ? 'Conversar 💬' : (isCompleted ? 'Revisar Planeta 🚀' : 'Explorar Planeta 🚀')}
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );

      const FractionManipulative = () => {
        const [parts, setParts] = useState(4);
        const [colored, setColored] = useState(1);
        useEffect(() => { setColored(c => Math.min(c, parts)); }, [parts]);
        return (
          <div className="mt-6 bg-orange-50 p-4 rounded-xl">
            <p className="font-semibold mb-2">Brinque com a pizza: escolha as partes e quantas colorir</p>
            <div className="flex flex-wrap gap-4 mb-3 items-center">
              <label className="flex items-center gap-2">Partes:
                <input type="range" min="2" max="12" value={parts} onChange={(e) => setParts(+e.target.value)} />
                <span className="ml-1 font-mono">{parts}</span>
              </label>
              <label className="flex items-center gap-2">Coloridas:
                <input type="range" min="0" max={parts} value={colored} onChange={(e) => setColored(+e.target.value)} />
                <span className="ml-1 font-mono">{colored}</span>
              </label>
            </div>
            <p className="text-lg">
              Fração formada: <strong>{colored}/{parts}</strong>
              <span className="text-sm text-gray-600"> — (numerador = partes pintadas; denominador = partes totais)</span>
            </p>
          </div>
        );
      };


      const LessonScreen = () => {
        const lesson = moduleLessons[currentModule];
        if (!lesson) return null;
        const profile = useContext(BrunoProfileContext);
        const curiosities = moduleCuriosities[currentModule] || [];
        const missions = moduleMissions[currentModule] || [];
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50 p-6 flex items-center justify-center">
            <div className="max-w-4xl w-full mx-auto space-y-6">
              <div className="bg-white rounded-2xl shadow-lg p-6 pop">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <span className="text-5xl">{planets.find(p => p.id === currentModule)?.emoji}</span>
                    <div>
                      <h2 className="text-3xl font-bold text-gray-800">{lesson.title}</h2>
                      <p className="text-gray-600">Vamos aprender juntos antes de praticar!</p>
                    </div>
                  </div>
                  <button onClick={() => setCurrentScreen('planets')} className="text-gray-500 hover:text-gray-800">
                    <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                  </button>
                </div>
              </div>
              <div className="bg-white rounded-3xl shadow-2xl p-8 pop">
                <div className="mb-6">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-2xl font-bold text-purple-600">{lesson.steps[currentStep].title}</h3>
                    <span className="text-sm text-gray-600">Passo {currentStep + 1} de {lesson.steps.length}</span>
                  </div>
                  <div className="bg-purple-50 p-6 rounded-2xl mb-6">
                    <div className="text-center mb-4"><span className="text-6xl">{lesson.steps[currentStep].visual}</span></div>
                    <div className="text-xl text-gray-800 mb-4 text-center font-medium flex items-center justify-center gap-2">
                      {lesson.steps[currentStep].content}
                      <ReadAloudButton text={lesson.steps[currentStep].content + ' Exemplo: ' + (lesson.steps[currentStep].example || '')} />
                    </div>
                  </div>
                  <div className="bg-gradient-to-r from-blue-50 to-green-50 border-2 border-blue-200 p-6 rounded-2xl">
                    <p className="text-sm font-semibold text-blue-700 mb-2">💡 Exemplo Prático:</p>
                    <p className="text-lg text-gray-700">{lesson.steps[currentStep].example}</p>
                  </div>
                  {currentModule === "fracoes" && <FractionManipulative />}
                </div>
                <div className="flex gap-4 justify-between">
                  <button onClick={() => { clickSound(); setCurrentStep(s => Math.max(0, s - 1)); }}
                    className="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold px-6 py-3 rounded-xl transition-all disabled:opacity-50" disabled={currentStep === 0}>← Anterior</button>
                  {currentStep < lesson.steps.length - 1 ? (
                    <button onClick={() => { clickSound(); setCurrentStep(s => s + 1); }}
                      className="ml-auto bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold px-8 py-3 rounded-xl hover:scale-105 transition-all">Próximo →</button>
                  ) : (
                    <button onClick={() => { clickSound(); startExercises(); }}
                      className="ml-auto bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold px-10 py-4 rounded-xl hover:scale-105 transition-all text-lg">Pronto! Vamos Praticar! 🚀</button>
                  )}
                </div>
              </div>
              <div className="flex justify-center gap-2">
                {lesson.steps.map((_, idx) => (
                  <div key={idx} className={`h-2 rounded-full transition-all ${idx === currentStep ? 'w-8 bg-purple-600' : 'w-2 bg-gray-300'}`} />
                ))}
              </div>
              {curiosities.length > 0 && (
                <div className="bg-white rounded-3xl shadow-2xl p-6 pop">
                  <h4 className="text-purple-700 font-bold text-xl mb-3">{profile.curiosityLabel}</h4>
                  <div className="grid md:grid-cols-2 gap-4">
                    {curiosities.map((item, idx) => (
                      <div key={idx} className="bg-purple-50 border border-purple-200 rounded-2xl p-4">
                        <h5 className="text-lg font-semibold text-purple-700 mb-1">{item.title}</h5>
                        <p className="text-sm text-purple-800 leading-relaxed">{item.detail}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {missions.length > 0 && (
                <div className="bg-gradient-to-r from-indigo-50 to-purple-50 border border-indigo-200 rounded-3xl p-6 pop">
                  <h4 className="text-indigo-700 font-bold text-xl mb-2">{profile.missionLabel}</h4>
                  <p className="text-sm text-indigo-600 mb-3">{profile.missionIntro}</p>
                  <ul className="space-y-2 text-gray-700">
                    {missions.map((mission, idx) => (
                      <li key={idx} className="flex items-start gap-3">
                        <span className="text-indigo-500 font-semibold">{idx + 1}.</span>
                        <span>{mission}</span>
                      </li>
                    ))}
                  </ul>
                </div>
              )}
            </div>
          </div>
        );
      };

      const LearningScreen = () => {
        const questions = moduleQuestions[currentModule]?.[difficulty] || [];
        const planet = planets.find(p => p.id === currentModule);

        if (!processedQ) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-purple-50 to-pink-50">
              <div className="bg-white rounded-3xl shadow-2xl p-8 text-center max-w-xl pop">
                <p className="text-2xl mb-4">Você concluiu as questões disponíveis. Preparando para finalizar...</p>
                <button onClick={() => { clickSound(); finishModule(); }} className="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold text-xl py-4 rounded-xl hover:scale-105 transition-all">Finalizar Módulo</button>
              </div>
            </div>
          );
        }

        return (
          <div className="min-h-screen bg-gradient-to-br from-purple-50 to-pink-50 p-6 flex items-center justify-center">
            <div className="max-w-4xl w-full mx-auto">
              <div className="bg-white rounded-2xl shadow-lg p-6 mb-6 pop">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <span className="text-4xl">{planet?.emoji}</span>
                    <div>
                      <h2 className="text-2xl font-bold text-gray-800">{planet?.name}</h2>
                      <p className="text-sm text-gray-600">Nível: {difficulty === 'easy' ? 'Iniciante' : difficulty === 'medium' ? 'Intermediário' : 'Avançado'}</p>
                    </div>
                  </div>
                  <div className="text-right">
                    <p className="text-sm text-gray-600">
                      {processedQ.skill === 'gemini-practice' ? <span className="font-bold text-purple-600">✨ Desafio do Bruno!</span> : remedialQueue.length ? <span className="font-bold text-purple-600">Reforço!</span> : `Questão ${currentQuestion + 1}/${questions.length}`}
                    </p>
                    <p className="text-lg font-bold text-purple-600">Pontos: {score}</p>
                  </div>
                  <button onClick={() => setCurrentScreen('planets')} className="text-gray-500 hover:text-gray-800">
                    <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                  </button>
                </div>
              </div>

              <div className="bg-white rounded-3xl shadow-2xl p-8 mb-6 pop">
                <p className="text-2xl text-gray-800 mb-6">{processedQ.question}</p>
                {processedQ.visual && (
                  <div className="bg-purple-50 p-4 rounded-2xl mb-6 text-center">
                    <p className="text-lg text-gray-700">{processedQ.visual}</p>
                  </div>
                )}

                <div className="grid grid-cols-2 gap-4">
                  {processedQ.options.map((opt, idx) => (
                    <button key={idx} onClick={() => handleAnswer(idx)} disabled={!!feedback} className="bg-gradient-to-r from-purple-100 to-pink-100 hover:from-purple-200 hover:to-pink-200 border-2 border-purple-300 p-6 rounded-2xl text-xl font-medium transition-all hover:scale-105 disabled:opacity-50 disabled:hover:scale-100">{opt}</button>
                  ))}
                </div>

                {!feedback && (
                  <div className="text-center mt-6">
                    <button onClick={handleGetHint} disabled={isHintLoading || !!geminiHint} className="bg-amber-100 text-amber-800 font-semibold px-4 py-2 rounded-lg hover:bg-amber-200 transition-all disabled:opacity-50">{isHintLoading ? 'Pensando...' : '💡 Pedir uma Dica do Bruno'}</button>
                  </div>
                )}

                {geminiHint && !feedback && (
                  <div className="mt-4 bg-amber-50 p-4 rounded-xl border border-amber-200">
                    <p className="text-amber-900 text-center"><span className="font-bold">Dica do Bruno:</span> {geminiHint}</p>
                  </div>
                )}
              </div>

              {aiGeneratedQuestion && (
                <div className="bg-white rounded-3xl shadow-2xl p-6 mb-6 border border-teal-200 pop">
                  <h4 className="text-teal-700 font-bold mb-2">Questão Inteligente em Fila:</h4>
                  <p className="text-gray-700">{aiGeneratedQuestion.question}</p>
                </div>
              )}

              {feedback && (
                <div className={`bg-white rounded-3xl shadow-2xl p-8 border-4 ${feedback.type === 'success' ? 'border-green-400' : 'border-orange-400'} pop`}>
                  <div className="text-center mb-4">
                    <div className="text-5xl mb-2">{feedback.type === 'success' ? '✅' : '🧩'}</div>
                    <h3 className="text-3xl font-bold mb-2">{feedback.message}</h3>
                  </div>
                  <div className="bg-blue-50 p-6 rounded-2xl mb-4">
                    <p className="text-lg text-gray-800 flex items-center justify-center gap-2">{feedback.explanation} <ReadAloudButton text={feedback.explanation} /></p>
                  </div>
                  {feedback.encouragement && <div className="bg-purple-50 p-4 rounded-xl mb-4"><p className="text-center text-purple-700 italic">{feedback.encouragement}</p></div>}
                  {isGeminiLoading && <div className="text-center my-2 text-purple-600 animate-pulse">Aguarde, o Bruno está trabalhando...</div>}
                  {geminiContent?.type === 'explanation' && (
                    <div className="mt-4 bg-purple-50 p-4 rounded-xl border border-purple-200">
                      <h4 className="font-bold text-purple-700">✨ Uma nova explicação do Bruno:</h4>
                      <MarkdownRenderer text={geminiContent.text} />
                    </div>
                  )}
                  {geminiContent?.type === 'error' && (
                    <div className="mt-4 bg-red-50 p-4 rounded-xl border border-red-200">
                      <p className="text-red-700 font-semibold text-center">{geminiContent.text}</p>
                    </div>
                  )}
                  <div className="flex flex-col sm:flex-row gap-4 mt-6">
                    {feedback.type === 'success' && (
                      <button onClick={() => handleGetSimilarProblem(false)} disabled={isGeminiLoading} className="flex-1 w-full bg-gradient-to-r from-teal-400 to-cyan-500 text-white font-bold text-lg py-3 px-4 rounded-xl hover:scale-105 transition-all disabled:opacity-60 disabled:hover:scale-100">{isGeminiLoading ? 'Criando...' : '✨ Crie um problema parecido'}</button>
                    )}
                    {feedback.type === 'error' && (
                      <button onClick={handleGetExplanation} disabled={isGeminiLoading} className="flex-1 w-full bg-gradient-to-r from-orange-400 to-amber-500 text-white font-bold text-lg py-3 px-4 rounded-xl hover:scale-105 transition-all disabled:opacity-60 disabled:hover:scale-100">{isGeminiLoading ? 'Pensando...' : '✨ Me explique de outro jeito'}</button>
                    )}
                    <button onClick={nextQuestion} disabled={isGeminiLoading} className="flex-1 w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold text-lg py-3 px-4 rounded-xl hover:scale-105 transition-all disabled:opacity-60 disabled:hover:scale-100">Próximo Desafio <span className="inline-block ml-2 transform">➡️</span></button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      };

      const ModuleCompleteScreen = () => {
        const answered = Math.max(answeredInModule, 1);
        const finalScore = ((score / answered) * 10).toFixed(1);
        const stars = Math.round(parseFloat(finalScore) / 2);
        const planet = planets.find(p => p.id === currentModule);
        return (
          <div className="min-h-screen bg-gradient-to-br from-yellow-50 via-orange-50 to-pink-50 p-6 flex items-center justify-center">
            <div className="max-w-2xl mx-auto text-center pop">
              <div className="text-7xl mb-6">🏆</div>
              <h2 className="text-5xl font-bold text-gray-800 mb-4">{parseFloat(finalScore) >= 8 ? "Planeta Conquistado!" : "Módulo Finalizado!"}</h2>
              <div className="bg-white rounded-3xl shadow-2xl p-8 mb-6">
                <div className="text-6xl mb-4">{planet?.emoji}</div>
                <h3 className="text-3xl font-bold text-purple-600 mb-6">{planet?.name}</h3>
                <div className="bg-gradient-to-r from-yellow-100 to-orange-100 p-6 rounded-2xl mb-6">
                  <p className="text-7xl font-bold text-orange-600 mb-2">{finalScore}</p>
                  <div className="flex justify-center gap-2 mb-4">
                    {Array.from({ length: 5 }).map((_, i) => (<span key={i} className={`text-3xl ${i < stars ? '' : 'opacity-30'}`}>⭐</span>))}
                  </div>
                  <p className="text-xl text-gray-700 font-semibold">{parseFloat(finalScore) >= 9 ? "🌟 Excelente raciocínio!" : parseFloat(finalScore) >= 8 ? "⭐ Muito bem!" : "💪 Continue praticando! Você está no caminho certo."}</p>
                </div>
                <div className="bg-purple-50 p-4 rounded-xl mb-6"><p className="text-lg text-purple-700">Você acertou {score} de {answered} questões!</p></div>
                {parseFloat(finalScore) >= 8 && <div className="bg-green-50 border-2 border-green-300 p-4 rounded-xl mb-4"><p className="text-green-700 font-semibold">✅ Novo planeta desbloqueado!</p></div>}
              </div>
              <button onClick={() => { startClick(); setCurrentScreen('planets'); }} className="bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold text-2xl px-12 py-5 rounded-2xl shadow-2xl hover:scale-105 transition-all">Explorar Mais Planetas 🚀</button>
            </div>
          </div>
        );
      };

      const renderScreen = () => {
        switch (currentScreen) {
          case 'name-entry': return <NameEntryScreen initialName={studentName} onSubmit={handleNameSubmit} />;
          case 'age-gate': return <AgeGateScreen />;
          case 'welcome': return <WelcomeScreen />;
          case 'diagnostic': return <DiagnosticScreen />;
          case 'diagnostic-result': return <DiagnosticResultScreen />;
          case 'planets': return <PlanetsScreen />;
          case 'lesson': return <LessonScreen />;
          case 'learning': return <LearningScreen />;
          case 'module-complete': return <ModuleCompleteScreen />;
          case 'chat':
            return (
              <ChatView
                chatHistory={chatHistory}
                isChatLoading={isChatLoading}
                onBack={() => setCurrentScreen('planets')}
                onSend={handleSendChatMessage}
              />
            );
          default: return null;
        }
      };

      return (
        <BrunoProfileContext.Provider value={profile}>
          <div>{renderScreen()}</div>
        </BrunoProfileContext.Provider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(<App />);
  </script>
</body>
</html>
